<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>air_combatAI_5 開発状況ダッシュボード</title>
<style>
  :root {
    --bg: #10151c; --panel: #182029; --line: #26313d; --fg: #e6edf3; --muted: #93a1b0;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; font-size: 14px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
           align-items: center; flex-wrap: wrap; background: #0d1218; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta.warn { color: var(--warn); font-weight: 600; }
  .spacer { flex: 1; }
  button, select { background: #1f2a36; color: var(--fg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; flex-wrap: wrap; }
  nav button { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }
  nav button.active { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); color: var(--accent); }
  main { padding: 0 20px 40px; }
  section.tab { display: none; background: var(--panel); border: 1px solid var(--line);
                border-top: none; border-radius: 0 0 8px 8px; padding: 16px; }
  section.tab.active { display: block; }
  h2 { font-size: 14px; margin: 20px 0 8px; color: var(--accent); }
  h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #131b23; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 150px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  code, pre { font-family: Consolas, "Courier New", monospace; }
  pre { background: #0b0f14; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        overflow-x: auto; font-size: 12px; margin: 0; white-space: pre-wrap; }
  .cmd-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
  .cmd-row .row-label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .cmd { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .cmd .title { color: var(--muted); min-width: 240px; font-size: 12px; }
  .cmd code { flex: 1; background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .cmd button { padding: 2px 8px; font-size: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .bar-row .label { width: 140px; color: var(--muted); font-size: 12px; }
  .bar { height: 16px; border-radius: 3px; background: var(--accent); }
  .bar.alt { background: #a371f7; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .rule-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; background: #131b23; }
  .rule-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  .rule-groups { display: flex; flex-wrap: wrap; gap: 18px; }
  .rule-group { flex: 1; min-width: 220px; }
  .rule-group-title { font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .rule-items { margin: 0; padding-left: 18px; color: var(--fg); line-height: 1.7; font-size: 13px; }
  .rule-items code { background: #0b0f14; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .traj-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .traj-stage { flex: 1 1 620px; min-width: 380px; }
  .traj-stage canvas { width: 100%; height: auto; display: block; background: #0b0f14;
                       border: 1px solid var(--line); border-radius: 8px; }
  .traj-side { flex: 0 1 330px; min-width: 260px; }
  .traj-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .traj-controls input[type=range] { flex: 1; min-width: 150px; accent-color: var(--accent); }
  .traj-controls label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .traj-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .traj-legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .traj-events { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: #0b0f14; }
  .traj-events div { padding: 3px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
                     font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .traj-events div:hover { background: #16202b; }
  .traj-events div.cur { color: var(--accent); background: #16202b; }
  .traj-note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .empty { color: var(--muted); padding: 8px 0; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
  .step { flex: 1 1 190px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #131b23; }
  .step .n { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center;
             border-radius: 50%; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .step .t { font-size: 13px; font-weight: 600; margin-left: 4px; }
  .step .d { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .step .h { font-size: 12px; color: var(--fg); opacity: .75; margin-top: 3px; line-height: 1.5; }
  .step.done { border-color: #24503a; } .step.done .n { background: var(--ok); color: #0b0f14; border-color: var(--ok); }
  .step.current { border-color: var(--accent); background: #14202c; } .step.current .n { background: var(--accent); color: #0b0f14; border-color: var(--accent); }
  .step.todo .t { color: var(--muted); }
.verify-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #131b23; }
.verify-block.current { border-color: var(--accent); background: #14202c; }
.verify-block h3 { margin: 0 0 4px; font-size: 14px; }
.verify-block .badge { margin-left: 6px; }
.verify-block .verify-text { font-size: 13px; line-height: 1.5; margin: 4px 0; }
.verify-pick { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.verify-pick label { color: var(--muted); font-size: 13px; }
.verify-pick select { background: #0e151c; color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 13px; max-width: 560px; }
  .facts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .fact { flex: 1 1 460px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #131b23; }
  .fact.hyp { border-color: #3d5a2e; } .fact.rule { border-color: #3b4a6b; }
  .fact.handled { opacity: .8; background: #10151a; border-color: #2a333b; border-style: dashed; }
  .fact.handled .fact-head .title { color: var(--muted); }
  .fact.parked { opacity: .7; }
  .badge.parked-tag { background: transparent; color: var(--muted); border-color: var(--line); }
  .fact.fresh { border-left: 3px solid var(--accent); }
  .badge.handled-tag { background: #262d34; color: #8b949e; border-color: #3a4249; }
  .fact-group-title { font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  .fact-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .fact-head .title { font-size: 14px; font-weight: 600; color: var(--accent); }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.official { border-color: #3b4a6b; color: var(--accent); }
  .badge.deep-pending { border-color: #8b6914; color: #e6b422; }
  .badge.deep-done { border-color: #2d6a3e; color: #56d364; }
  .fact .summary { font-size: 13px; line-height: 1.7; margin: 6px 0; color: var(--fg); }
  .fact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; margin: 6px 0; }
  .fact-grid .k { color: var(--muted); font-size: 12px; }
  .fact-grid .v { font-size: 13px; font-variant-numeric: tabular-nums; }
  .fact .hyp-box { border-left: 3px solid #3d5a2e; background: #101a14; padding: 6px 10px; margin: 8px 0; font-size: 13px; line-height: 1.7; }
  .fact .hyp-box .k { color: var(--ok); font-size: 12px; }
  .fact .metric { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .fact .metric b { color: var(--fg); font-weight: 600; }
  .fact-grid .v.changed { background: #2d2a1a; border-left: 3px solid var(--warn); padding-left: 6px; }
  .fact-grid .v.new { background: #1a2d1a; border-left: 3px solid var(--ok); padding-left: 6px; }
  .fact-grid .diff-icon { color: var(--warn); font-size: 10px; margin-left: 4px; vertical-align: middle; }
  .fact-grid .diff-icon.new { color: var(--ok); }
  .fact-list { margin: 6px 0; padding: 0; list-style: none; }
  .fact-list li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .fact-list .title { color: var(--accent); min-width: 130px; }
  .fact-list .text { flex: 1; line-height: 1.6; }
  .fact-list button { padding: 1px 8px; font-size: 11px; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fact-grid > .extra { display: none; }
  .fact-grid.open > .extra { display: block; }
  .fact-list li.extra { display: none; }
  .fact-list.open li.extra { display: flex; }
  .fact-grid .more-toggle { grid-column: 1 / -1; }
  .more-toggle button { padding: 1px 8px; font-size: 11px; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
  .more-toggle button:hover { color: var(--fg); border-color: var(--accent); }
  .hypho { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #131b23; }
  .hy-row { display: grid; grid-template-columns: 84px minmax(150px, 260px) 1fr; gap: 8px;
            align-items: center; margin-bottom: 6px; }
  .hy-row label { font-size: 12px; color: var(--muted); }
  .hy-row select, .hy-row input { font-size: 12px; padding: 4px 6px; background: #0b0f14;
            color: var(--fg); border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  .hy-out { margin: 10px 0 6px; border-left: 3px solid var(--accent); padding: 6px 10px; background: #0b0f14; }
  .hy-out .k { font-size: 11px; color: var(--muted); }
  .hy-out .text { font-size: 13px; line-height: 1.7; margin-top: 2px; white-space: pre-wrap; }
  .hy-copy-bar { position: sticky; bottom: 4px; background: #131b23;
                 padding: 6px 4px 4px; border-top: 1px solid var(--line);
                 margin-top: 6px; z-index: 1; }
  button.big { background: var(--accent); color: #0b0f14; border-color: var(--accent);
               font-weight: 600; padding: 6px 16px; width: 100%; }
</style>
</head>
<body>
<header>
  <h1>air_combatAI_5 開発状況</h1>
  <span class="meta" id="stamp">読み込み中…</span>
  <span class="spacer"></span>
  <label class="meta"><input type="checkbox" id="auto"> 自動更新</label>
  <select id="interval">
    <option value="15000">15秒</option>
    <option value="30000">30秒</option>
    <option value="60000">60秒</option>
  </select>
  <button id="refresh">再読み込み</button>
</header>

<nav id="nav"></nav>

<main>
  <section class="tab" id="tab-env"><h2>環境</h2><div id="env"></div></section>
  <section class="tab" id="tab-sub"><h2>提出</h2><div id="sub"></div></section>
  <section class="tab" id="tab-agents"><h2>エージェント（提出パッケージの中身）</h2><div id="agents"></div></section>
  <section class="tab" id="tab-impl"><h2>実装状態（変数）</h2><div id="impl"></div></section>
  <section class="tab" id="tab-eval"><h2>評価（seed固定ペア評価）</h2><div id="eval"></div></section>
  <section class="tab" id="tab-logs"><h2>ログ</h2><div id="logs"></div></section>
  <section class="tab" id="tab-hyp"><h2>仮説登録</h2><div id="hyp"></div></section>
  <section class="tab" id="tab-session"><h2>改善サイクル</h2><div id="session"></div></section>
  <section class="tab" id="tab-verify"><h2>検証</h2><div id="verify"></div></section>
  <section class="tab" id="tab-git"><h2>git</h2><div id="git">  <div class="cmd-row">
    <button class="copy" data-cmd="status">ステータス表示</button>
    <button class="copy" data-cmd="log -1">最近のコミット</button>
    <button class="copy" data-cmd="branch">ブランチ表示</button>
  </div><div class="cmd-row"><span class="row-label">指示</span>
    <button class="copy" data-cmd="変更をコミットしてプッシュして。事前に git status と git diff を確認し、ステージ対象のファイル一覧とコミットメッセージ案を提示して承認を得ること">コミット＆プッシュ</button>
    <button class="copy" data-cmd="この変更の PR を作成して。タイトルと本文は日本語で書くこと">PR作成</button>
    <button class="copy" data-cmd="PR の CI テスト結果を確認して。失敗していれば原因を報告して">CI確認</button>
    <button class="copy" data-cmd="PR をマージして">マージ</button>
  </div></div></section>
  <section class="tab" id="tab-cmd"><h2>コマンド</h2><div id="cmd"></div></section>
  <section class="tab" id="tab-rules"><h2>コンペルール</h2><div id="rules"></div></section>
  <section class="tab" id="tab-traj"><h2>自機視点リプレイ（自作エージェントのログのみ）</h2><div id="traj"></div></section>
  <section class="tab" id="tab-battle"><h2>戦場俯瞰（両陣営のシミュレーションイメージ）</h2><div id="battle"></div></section>
</main>

<script src="js/core.js"></script>
<script src="js/env.js"></script>
<script src="js/submission.js"></script>
<script src="js/agents.js"></script>
<script src="js/impl.js"></script>
<script src="js/evaluation.js"></script>
<script src="js/logs.js"></script>
<script src="js/hypothesis.js"></script>
<script src="js/session.js"></script>
<script src="js/verify.js"></script>
<script src="js/git.js"></script>
<script src="js/commands.js"></script>
<script src="js/rules.js"></script>
<script src="js/trajectory.js"></script>
<script src="js/battle.js"></script>
<script src="js/app.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Force git tab to be active on page load (版ズレ再読み込み時は維持)
    let keep = false;
    try {
      keep = sessionStorage.getItem("dash-keep-tab") === "1";
      sessionStorage.removeItem("dash-keep-tab");
    } catch (e) {}
    if (!keep) showTab('git');
  });
</script></body>
</html>
