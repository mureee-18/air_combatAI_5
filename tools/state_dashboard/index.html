<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>air_combatAI_5 開発状況ダッシュボード</title>
<style>
  :root {
    --bg: #10151c; --panel: #182029; --line: #26313d; --fg: #e6edf3; --muted: #93a1b0;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; font-size: 14px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
           align-items: center; flex-wrap: wrap; background: #0d1218; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button, select { background: #1f2a36; color: var(--fg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; flex-wrap: wrap; }
  nav button { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }
  nav button.active { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); color: var(--accent); }
  main { padding: 0 20px 40px; }
  section.tab { display: none; background: var(--panel); border: 1px solid var(--line);
                border-top: none; border-radius: 0 0 8px 8px; padding: 16px; }
  section.tab.active { display: block; }
  h2 { font-size: 14px; margin: 20px 0 8px; color: var(--accent); }
  h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #131b23; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 150px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  code, pre { font-family: Consolas, "Courier New", monospace; }
  pre { background: #0b0f14; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        overflow-x: auto; font-size: 12px; margin: 0; white-space: pre-wrap; }
  .cmd-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
  .cmd-row .row-label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .cmd { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .cmd .title { color: var(--muted); min-width: 240px; font-size: 12px; }
  .cmd code { flex: 1; background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .cmd button { padding: 2px 8px; font-size: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .bar-row .label { width: 140px; color: var(--muted); font-size: 12px; }
  .bar { height: 16px; border-radius: 3px; background: var(--accent); }
  .bar.alt { background: #a371f7; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .rule-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; background: #131b23; }
  .rule-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  .rule-groups { display: flex; flex-wrap: wrap; gap: 18px; }
  .rule-group { flex: 1; min-width: 220px; }
  .rule-group-title { font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .rule-items { margin: 0; padding-left: 18px; color: var(--fg); line-height: 1.7; font-size: 13px; }
  .rule-items code { background: #0b0f14; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .traj-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .traj-stage { flex: 1 1 620px; min-width: 380px; }
  .traj-stage canvas { width: 100%; height: auto; display: block; background: #0b0f14;
                       border: 1px solid var(--line); border-radius: 8px; }
  .traj-side { flex: 0 1 330px; min-width: 260px; }
  .traj-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .traj-controls input[type=range] { flex: 1; min-width: 150px; accent-color: var(--accent); }
  .traj-controls label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .traj-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .traj-legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .traj-events { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: #0b0f14; }
  .traj-events div { padding: 3px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
                     font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .traj-events div:hover { background: #16202b; }
  .traj-events div.cur { color: var(--accent); background: #16202b; }
  .traj-note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .empty { color: var(--muted); padding: 8px 0; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
  .step { flex: 1 1 190px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #131b23; }
  .step .n { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center;
             border-radius: 50%; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .step .t { font-size: 13px; font-weight: 600; margin-left: 4px; }
  .step .d { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .step .h { font-size: 12px; color: var(--fg); opacity: .75; margin-top: 3px; line-height: 1.5; }
  .step.done { border-color: #24503a; } .step.done .n { background: var(--ok); color: #0b0f14; border-color: var(--ok); }
  .step.current { border-color: var(--accent); background: #14202c; } .step.current .n { background: var(--accent); color: #0b0f14; border-color: var(--accent); }
  .step.todo .t { color: var(--muted); }
  .facts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .fact { flex: 1 1 460px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #131b23; }
  .fact.hyp { border-color: #3d5a2e; } .fact.rule { border-color: #3b4a6b; }
  .fact-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .fact-head .title { font-size: 14px; font-weight: 600; color: var(--accent); }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.official { border-color: #3b4a6b; color: var(--accent); }
  .fact .summary { font-size: 13px; line-height: 1.7; margin: 6px 0; color: var(--fg); }
  .fact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; margin: 6px 0; }
  .fact-grid .k { color: var(--muted); font-size: 12px; }
  .fact-grid .v { font-size: 13px; font-variant-numeric: tabular-nums; }
  .fact .hyp-box { border-left: 3px solid #3d5a2e; background: #101a14; padding: 6px 10px; margin: 8px 0; font-size: 13px; line-height: 1.7; }
  .fact .hyp-box .k { color: var(--ok); font-size: 12px; }
  .fact .metric { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .fact .metric b { color: var(--fg); font-weight: 600; }
  .fact-grid .v.changed { background: #2d2a1a; border-left: 3px solid var(--warn); padding-left: 6px; }
  .fact-grid .v.new { background: #1a2d1a; border-left: 3px solid var(--ok); padding-left: 6px; }
  .fact-grid .diff-icon { color: var(--warn); font-size: 10px; margin-left: 4px; vertical-align: middle; }
  .fact-grid .diff-icon.new { color: var(--ok); }
  .fact-list { margin: 6px 0; padding: 0; list-style: none; }
  .fact-list li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .fact-list .title { color: var(--accent); min-width: 130px; }
  .fact-list .text { flex: 1; line-height: 1.6; }
  .fact-list button { padding: 1px 8px; font-size: 11px; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fact-grid > .extra { display: none; }
  .fact-grid.open > .extra { display: block; }
  .fact-list li.extra { display: none; }
  .fact-list.open li.extra { display: flex; }
  .fact-grid .more-toggle { grid-column: 1 / -1; }
  .more-toggle button { padding: 1px 8px; font-size: 11px; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
  .more-toggle button:hover { color: var(--fg); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>air_combatAI_5 開発状況</h1>
  <span class="meta" id="stamp">読み込み中…</span>
  <span class="spacer"></span>
  <label class="meta"><input type="checkbox" id="auto" checked> 自動更新</label>
  <select id="interval">
    <option value="15000">15秒</option>
    <option value="30000">30秒</option>
    <option value="60000">60秒</option>
  </select>
  <button id="refresh">再読み込み</button>
</header>

<nav id="nav"></nav>

<main>
  <section class="tab" id="tab-env"><h2>環境</h2><div id="env"></div></section>
  <section class="tab" id="tab-sub"><h2>提出</h2><div id="sub"></div></section>
  <section class="tab" id="tab-eval"><h2>評価（seed固定ペア評価）</h2><div id="eval"></div></section>
  <section class="tab" id="tab-logs"><h2>ログ</h2><div id="logs"></div></section>
  <section class="tab" id="tab-hyp"><h2>仮説登録</h2><div id="hyp"></div></section>
  <section class="tab" id="tab-session"><h2>改善サイクル</h2><div id="session"></div></section>
  <section class="tab" id="tab-git"><h2>git</h2><div id="git">  <div class="cmd-row">
    <button class="copy" data-cmd="status">ステータス表示</button>
    <button class="copy" data-cmd="log -1">最近のコミット</button>
    <button class="copy" data-cmd="branch">ブランチ表示</button>
  </div><div class="cmd-row"><span class="row-label">指示</span>
    <button class="copy" data-cmd="変更をコミットしてプッシュして。事前に git status と git diff を確認し、ステージ対象のファイル一覧とコミットメッセージ案を提示して承認を得ること">コミット＆プッシュ</button>
    <button class="copy" data-cmd="この変更の PR を作成して。タイトルと本文は日本語で書くこと">PR作成</button>
    <button class="copy" data-cmd="PR の CI テスト結果を確認して。失敗していれば原因を報告して">CI確認</button>
    <button class="copy" data-cmd="PR をマージして">マージ</button>
  </div></div></section>
  <section class="tab" id="tab-cmd"><h2>コマンド</h2><div id="cmd"></div></section>
  <section class="tab" id="tab-rules"><h2>コンペルール</h2><div id="rules"></div></section>
  <section class="tab" id="tab-traj"><h2>軌跡リプレイ（自作エージェントのログのみ）</h2><div id="traj"></div></section>
</main>

<script>
const TABS = [
  ["env", "環境"], ["sub", "提出"], ["eval", "評価"], ["logs", "ログ"],
  ["hyp", "仮説登録"], ["session", "改善サイクル"], ["git", "git"], ["cmd", "コマンド"], ["rules", "ルール"],
  ["traj", "軌跡"],
];
const nav = document.getElementById("nav");
const state = { data: null, timer: null, selected: null };

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// HTML 属性値用のエスケープ（コマンド内の " が属性を壊すため必須）
function attr(s) {
  return esc(s).replace(/"/g, "&quot;");
}
function num(v, digits) {
  if (v === null || v === undefined || v === "") return "—";
  return Number(v).toFixed(digits === undefined ? 2 : digits);
}
function table(headers, rows) {
  if (!rows.length) return '<div class="empty">データがありません</div>';
  let h = "<table><thead><tr>";
  headers.forEach(x => h += `<th>${esc(x.label)}</th>`);
  h += "</tr></thead><tbody>";
  rows.forEach(r => {
    h += "<tr>";
    r.forEach((c, i) => {
      const cls = headers[i].num ? ' class="num"' : "";
      h += `<td${cls}>${c}</td>`;
    });
    h += "</tr>";
  });
  return h + "</tbody></table>";
}
function cards(items) {
  return '<div class="cards">' + items.map(i =>
    `<div class="card"><div class="k">${esc(i.k)}</div><div class="v ${i.cls || ""}">${esc(i.v)}</div></div>`
  ).join("") + "</div>";
}
function copy(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent; btn.textContent = "コピー済"; setTimeout(() => btn.textContent = old, 1200);
  });
}

function renderEnv(d) {
  const e = d.environment;
  const drift = e.deploy_drift;
  const driftCls = drift === null ? "" : (drift.args_match && drift.config_match ? "ok" : "warn");
  const driftTxt = drift === null ? "未配置"
    : ((drift.args_match && drift.config_match) ? "一致" : ",要再ビルド");
  let h = cards([
    { k: "specialist (repo)", v: e.repo_specialist },
    { k: "workspace", v: e.workspace.exists ? e.workspace.size_h : "無し", cls: e.workspace.exists ? "" : "bad" },
    { k: "シミュレータ", v: e.workspace.simulator_ready ? "配置済み" : "未配置", cls: e.workspace.simulator_ready ? "ok" : "bad" },
    { k: "配置ドリフト", v: driftTxt, cls: driftCls },
    { k: "ホスト", v: e.host.python },
  ]);
  h += "<h2>Docker コンテナ</h2>";
  if (!e.docker.available) h += '<div class="empty">docker コマンドを実行できません（Docker Desktop が起動中か確認）</div>';
  else if (!e.docker.containers.length) h += '<div class="empty">起動中のコンテナはありません</div>';
  else h += table([{label:"コンテナ"},{label:"ステータス"},{label:"イメージ"}],
    e.docker.containers.map(c => [esc(c.name), esc(c.status), esc(c.image)]));
  h += "<h2>配置（workspace/Agents）</h2>";
  h += table([{label:"Agent ディレクトリ"},{label:"備考"}],
    (e.workspace.agents.length ? e.workspace.agents : ["—"]).map(a =>
      [esc(a), a === "MyAgent" ? "ビルドした提出物" : (a === "BenchMark" ? "公式ベンチマーク" : "")]));
  h += "<h2>ホスト情報</h2>";
  h += table([{label:"項目"},{label:"値"}], [
    ["OS", esc(e.host.platform)],
    ["Python (ホスト)", esc(e.host.python)],
    ["numpy (ホスト)", e.host.numpy ? "導入済み" : "未導入（コンテナ内で実行するツール.matrix)"],
  ]);
  document.getElementById("env").innerHTML = h;
}

function renderSub(d) {
  const s = d.submission;
  let h = cards([
    { k: "specialist", v: s.specialist, cls: s.specialist_allowed ? "ok" : "bad" },
    { k: "提出可能", v: s.specialist_allowed ? "YES" : "NO", cls: s.specialist_allowed ? "ok" : "bad" },
    { k: "submit.zip", v: s.zip.exists ? s.zip.size_h : "未ビルド", cls: s.zip.exists ? "ok" : "warn" },
    { k: "ゲート", v: s.gate_ok ? "OK" : "BLOCK", cls: s.gate_ok ? "ok" : "warn" },
  ]);
  h += "<h2>args.json</h2><pre>" + esc(JSON.stringify(s.args, null, 2)) + "</pre>";
  h += "<h2>提出物のルートファイル</h2>";
  h += table([{label:"ファイル"},{label:"有無"}],
    Object.keys(s.zip_entries).map(k => [esc(k), s.zip_entries[k] ? '<span class="ok">あり</span>' : '<span class="bad">なし</span>']));
  h += "<h2>提出前ゲート（tools/hooks/pre_submit_gate.py）</h2>";
  h += "<p class=\"meta\">ゲートは <code>" + esc(s.confirm_env) + "=1</code> なしの実行を BLOCK 扱いします（意図した設計）。</p>";
  h += "<pre>" + esc(s.gate_output.join("\n")) + "</pre>";
  if (s.zip.exists) h += `<p class="meta">ビルド日時: ${esc(s.zip.mtime)} / サイズ: ${esc(s.zip.size_h)}</p>`;
  document.getElementById("sub").innerHTML = h;
}

function renderEval(d) {
  const p = d.paired;
  if (!p.files.length) {
    document.getElementById("eval").innerHTML =
      '<div class="empty">workspace/paired/*.json がありません。<br>docker exec atla5-cpu bash -lc "cd /workspace && python /repo/local_test/run_eval_paired.py --seeds 1,2,3 --colors both --label baseline --out /workspace/paired/baseline.json"</div>';
    return;
  }
  const rows = p.files.map(f => {
    const m = f.metrics || {};
    const best = f.name === p.best ? " ★" : "";
    return [
      esc((m.label || f.name) + best), f.name,
      m.games ?? "—", `${m.win ?? "—"}/${m.draw ?? "—"}/${m.loss ?? "—"}`,
      num(m.avg_score, 3), num(m.avg_our_alive, 2), num(m.avg_enemy_alive, 2), esc(f.mtime),
    ];
  });
  let h = cards([
    { k: "評価ファイル", v: p.files.length },
    { k: "最良", v: p.best || "—" },
  ]);
  h += "<h2>比較（★ が avg_score 最良）</h2>";
  h += table([
    {label:"label", num:false}, {label:"ファイル", num:false}, {label:"対戦数", num:true},
    {label:"win/draw/loss", num:false}, {label:"avg_score", num:true},
    {label:"avg_our_alive", num:true}, {label:"avg_enemy_alive", num:true}, {label:"更新", num:false},
  ], rows);

  if (p.history && p.history.length) {
    h += "<h2>強化推移（時系列・古い順）</h2>";
    h += '<div class="section" style="margin-top:8px">';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">';
    h += '<span class="muted">指標：</span>';
    h += '<button class="btn small active" data-hist-metric="avg_score">avg_score</button>';
    h += '<button class="btn small" data-hist-metric="win_rate">勝率(%)</button>';
    h += '<button class="btn small" data-hist-metric="avg_our_alive">avg_our_alive</button>';
    h += '<button class="btn small" data-hist-metric="avg_enemy_alive">avg_enemy_alive</button>';
    h += '<span class="muted" style="margin-left:8px">系列：label別</span>';
    h += '</div>';
    h += '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--bg-soft)">';
    h += '<svg id="hist-chart" width="960" height="240" viewBox="0 0 960 240" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:320px"></svg>';
    h += '</div>';
    h += '<div id="hist-legend" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"></div>';
    h += '</div>';
    h += table([
      {label:"mtime", num:false}, {label:"label", num:false}, {label:"ファイル", num:false},
      {label:"対戦数", num:true}, {label:"win/draw/loss", num:false},
      {label:"avg_score", num:true}, {label:"avg_our_alive", num:true}, {label:"avg_enemy_alive", num:true},
    ], p.history.map(hf => {
      const m = hf.metrics || {};
      return [
        esc(hf.mtime),
        esc(m.label || hf.name),
        esc(hf.name),
        m.games ?? "—",
        `${m.win ?? "—"}/${m.draw ?? "—"}/${m.loss ?? "—"}`,
        num(m.avg_score, 3),
        num(m.avg_our_alive, 2),
        num(m.avg_enemy_alive, 2),
      ];
    }));
    // defer chart render
    setTimeout(() => renderHistoryChart(p.history), 0);
  }

  h += "<h2>avg_score 比較</h2>";
  const max = Math.max(1, ...p.files.map(f => (f.metrics || {}).avg_score || 0));
  p.files.forEach(f => {
    const m = f.metrics || {};
    const w = Math.round(((m.avg_score || 0) / max) * 100);
    h += `<div class="bar-row"><span class="label">${esc(m.label || f.name)}</span>` +
         `<span class="bar ${f.name === p.best ? "" : "alt"}" style="width:${w}%"></span>` +
         `<span>${num(m.avg_score, 3)}</span></div>`;
  });

  h += "<h2>明細</h2>";
  h += '<div id="rows"></div>';
  document.getElementById("eval").innerHTML = h;

  const sel = document.createElement("select");
  p.files.forEach(f => {
    const o = document.createElement("option");
    o.value = f.name; o.textContent = f.name; sel.appendChild(o);
  });
  const box = document.getElementById("rows");
  const renderRows = () => {
    const f = p.files.find(x => x.name === sel.value);
    box.innerHTML = table([
      {label:"色", num:false}, {label:"seed", num:true}, {label:"結果", num:false},
      {label:"終了理由", num:false}, {label:"ステップ", num:true},
      {label:"自機生存", num:true}, {label:"敵生存", num:true}, {label:"スコア", num:true},
    ], (f.rows || []).map(r => [
      esc(r.color), r.seed,
      `<span class="${r.result === "win" ? "ok" : (r.result === "loss" ? "bad" : "muted")}">${esc(r.result)}</span>`,
      esc(r.endReason), r.step_count, num(r.our_alive, 0), num(r.enemy_alive, 0), num(r.score, 3),
    ]));
  };
  sel.addEventListener("change", renderRows);
  box.prepend(sel);
  sel.value = state.selected && p.files.some(f => f.name === state.selected) ? state.selected : p.files[0].name;

const STEP_STATE_LABEL = { done: "済", current: "次", todo: "未" };

function cmdRow(cmd, label) {
  if (!cmd) return "";
  return `<div class="cmd"><span class="title">${esc(label || "コマンド")}</span>` +
         `<code>${esc(cmd)}</code><button data-cmd="${attr(cmd)}">コピー</button></div>`;
}

function bindCopy(root) {
  root.querySelectorAll("button[data-cmd]").forEach(btn => {
    btn.addEventListener("click", () => copy(btn.dataset.cmd, btn));
  });
}

function bindFactToggle(root) {
  root.querySelectorAll("button[data-fact-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.closest(".fact-grid, .fact-list");
      if (!box) return;
      const open = box.classList.toggle("open");
      btn.textContent = open ? btn.dataset.less : btn.dataset.more;
    });
  });
}

function renderSteps(steps) {
  if (!steps || !steps.length) return '<div class="empty">対象 specialist が未設定です。</div>';
  let h = '<div class="steps">';
  steps.forEach((s, i) => {
    h += `<div class="step ${s.state}">` +
         `<span class="n">${STEP_STATE_LABEL[s.state] || "?"}</span>` +
         `<span class="t">${i + 1}. ${esc(s.label)}</span>` +
         `<div class="d">${esc(s.detail || "")}</div>` +
         `<div class="h">${esc(s.hint || "")}</div>`;
    h += "</div>";
  });
  return h + "</div>";
}

function renderFact(card) {
  const badgeKind = { observation: "観測", assumption: "前提", rule: "公式ルール" };
  const badgeSrc = { log: "ログ", code: "コード", official: "公式" };
  let h = `<div class="fact ${card.kind}">`;
  h += '<div class="fact-head">' +
       `<span class="title">${esc(card.title)}</span>` +
       `<span class="badge">${esc(badgeKind[card.kind] || card.kind)}</span>` +
       `<span class="badge${card.source === "official" ? " official" : ""}">` +
       `${esc(badgeSrc[card.source] || card.source)}</span></div>`;
  if (card.summary) h += `<div class="summary clamp2">${esc(card.summary)}</div>`;

  if (card.evidence && card.evidence.length) {
    const LIMIT = 8;
    const hasExtra = card.evidence.length > LIMIT;
    h += '<div class="fact-grid">';
    card.evidence.forEach((e, idx) => {
      const digits = e.digits !== undefined ? e.digits : (Number.isInteger(e.value) ? 0 : 2);
      const v = e.num ? num(e.value, digits) : esc(e.value);
      const diffClass = e._diff === "changed" ? "changed" : (e._diff === "new" ? "new" : "");
      const diffIcon = e._diff === "changed" ? '<span class="diff-icon">🔄</span>' : (e._diff === "new" ? '<span class="diff-icon new">NEW</span>' : "");
      const prevDisplay = e._diff === "changed" && e._prevValue !== undefined ? ` <span class="k" style="opacity:0.6">(前: ${esc(String(e._prevValue))})</span>` : "";
      const cls = hasExtra && idx >= LIMIT ? ' class="extra"' : "";
      h += `<div${cls}><div class="k">${esc(e.label)}</div><div class="v ${diffClass}">${v}${diffIcon}${prevDisplay}</div></div>`;
    });
    if (hasExtra) {
      const n = card.evidence.length - LIMIT;
      h += `<div class="more-toggle"><button data-fact-toggle data-more="+${n}件を表示" data-less="折りたたむ">+${n}件を表示</button></div>`;
    }
    h += "</div>";
  }

  if (card.items && card.items.length) {
    const LIMIT = 3;
    const hasExtra = card.items.length > LIMIT;
    h += '<ul class="fact-list">';
    card.items.forEach((it, idx) => {
      const title = it.title ? `<span class="title">${esc(it.title)}</span>` : "";
      const cls = hasExtra && idx >= LIMIT ? ' class="extra"' : "";
      h += `<li${cls}>${title}<span class="text">${esc(it.text)}</span>` +
           `<button data-cmd="${attr(it.command)}">コピー</button></li>`;
    });
    if (hasExtra) {
      const n = card.items.length - LIMIT;
      h += `<li class="more-toggle"><button data-fact-toggle data-more="+${n}件を表示" data-less="折りたたむ">+${n}件を表示</button></li>`;
    }
    h += "</ul>";
  }

  if (card.hypothesis) {
    h += '<div class="hyp-box"><div class="k">ここから立てられる仮説例</div>' +
         `<div class="clamp2">${esc(card.hypothesis)}</div></div>`;
  }
  if (card.metric) h += `<div class="metric">判定指標: <b>${esc(card.metric)}</b></div>`;
  h += cmdRow(card.command, card.command_label);
  return h + "</div>";
}

function renderHypothesis(d) {
  const s = d.session;
  const sessions = s.sessions || [];
  const cur = sessions.find(x => x.specialist === s.target) || sessions[sessions.length - 1];
  let h = "";
  if (!sessions.length) {
    h += '<div class="empty">セッション記録がありません。' +
         '<code>python analysis/tools/improvement_session.py start --specialist default</code></div>';
  }
  if (cur) {
    h += cards([
      { k: "対象 specialist", v: cur.specialist, cls: cur.specialist === s.submitted ? "" : "warn" },
      { k: "提出用 specialist", v: s.submitted || "—", cls: "ok" },
      { k: "開始", v: (cur.started || "—").replace("T", " ") },
      { k: "仮説", v: (cur.hypotheses || []).length, cls: (cur.hypotheses || []).length ? "ok" : "warn" },
      { k: "前提", v: (cur.assumptions || []).length },
    ]);
    if (cur.specialist !== s.submitted) {
      h += `<p class="meta">対象は <b>${esc(cur.specialist)}</b>（ローカル評価専用）。` +
           `提出するのは <b>${esc(s.submitted)}</b>。${esc(cur.specialist)} を submit しない。</p>`;
    }
  }

  h += "<h2>事実カード（ここから仮説を立てる材料）</h2>";
  if (!s.evidence || !s.evidence.length) {
    h += '<div class="empty">事実カードを組み立てるデータがありません（ペア評価・ログ・軌跡）。</div>';
  } else {
    h += '<div class="facts">' + s.evidence.map(renderFact).join("") + "</div>";
  }

  document.getElementById("hyp").innerHTML = h;
  bindCopy(document.getElementById("hyp"));
  bindFactToggle(document.getElementById("hyp"));
}

function renderSession(d) {
  const s = d.session;
  const sessions = s.sessions || [];
  const cur = sessions.find(x => x.specialist === s.target) || sessions[sessions.length - 1];
  let h = "";
  if (!sessions.length) {
    h += '<div class="empty">セッション記録がありません。' +
         '<code>python analysis/tools/improvement_session.py start --specialist default</code></div>';
  }
  if (cur) {
    h += cards([
      { k: "対象 specialist", v: cur.specialist, cls: cur.specialist === s.submitted ? "" : "warn" },
      { k: "提出用 specialist", v: s.submitted || "—", cls: "ok" },
      { k: "仮説", v: (cur.hypotheses || []).length, cls: (cur.hypotheses || []).length ? "ok" : "warn" },
      { k: "サイクル", v: (cur.cycles || []).length },
    ]);
  }

  h += "<h2>改善サイクル（現在地）</h2>" + renderSteps(s.steps);

  if (cur) {
    const items = [
      ...(cur.assumptions || []).map(a => ["前提", JSON.stringify(a)]),
      ...(cur.hypotheses || []).map(x => ["仮説", JSON.stringify(x)]),
      ...(cur.cycles || []).map(x => ["サイクル", JSON.stringify(x)]),
    ];
    h += "<h2>仮説・サイクル・記録</h2>";
    h += items.length
      ? table([{label:"種別",num:false},{label:"内容",num:false}],
          items.map(i => [esc(i[0]), `<code>${esc(i[1])}</code>`]))
      : '<div class="empty">まだ記録がありません。</div>';
  }

  document.getElementById("session").innerHTML = h;
}

const GIT_INSTRUCTIONS = [
  ["コミット＆プッシュ",
   "変更をコミットしてプッシュして。事前に git status と git diff を確認し、ステージ対象のファイル一覧とコミットメッセージ案を提示して承認を得ること"],
  ["PR作成", "この変更の PR を作成して。タイトルと本文は日本語で書くこと"],
  ["CI確認", "PR の CI テスト結果を確認して。失敗していれば原因を報告して"],
  ["マージ", "PR をマージして"],
];
const GIT_CMD_ROW = '<div class="cmd-row">' +
  '<button class="copy" data-cmd="status">ステータス表示</button>' +
  '<button class="copy" data-cmd="log -1">最近のコミット</button>' +
  '<button class="copy" data-cmd="branch">ブランチ表示</button>' +
  '</div><div class="cmd-row"><span class="row-label">指示</span>' +
  GIT_INSTRUCTIONS.map(([label, text]) =>
    `<button class="copy" data-cmd="${attr(text)}">${esc(label)}</button>`).join("") +
  '</div>';

function renderGit(d) {
  const g = d.git;
  const ab = g.ahead_behind;
  const total = g.dirty.modified + g.dirty.untracked + g.dirty.other;
  const parts = [];
  if (g.dirty.modified) parts.push("変更 " + g.dirty.modified);
  if (g.dirty.untracked) parts.push("未追跡 " + g.dirty.untracked);
  if (g.dirty.other) parts.push("その他 " + g.dirty.other);
  const branchV = g.branch + (ab ? `（ahead ${ab.ahead} / behind ${ab.behind}）` : "");
  let h = GIT_CMD_ROW + cards([
    { k: "ブランチ", v: branchV, cls: ab && ab.ahead ? "warn" : "" },
    { k: "未コミット", v: total ? `${total}（${parts.join("・")}）` : "0",
      cls: total ? "warn" : "ok" },
  ]);
  h += "<h2>リモート</h2>";
  h += table([{label:"項目",num:false},{label:"値",num:false}], [
    ["origin", esc(g.remote || "未設定")], ["upstream", esc(g.upstream || "未設定")],
  ]);
  h += "<h2>直近のコミット</h2>";
  h += g.recent.length ? "<pre>" + esc(g.recent.join("\n")) + "</pre>" : '<div class="empty">なし</div>';
  document.getElementById("git").innerHTML = h;
  bindCopy(document.getElementById("git"));
}

function renderCmd(d) {
  let h = "";
  d.commands.forEach(group => {
    h += `<h2>${esc(group.group)}</h2>`;
    group.items.forEach(item => {
      h += `<div class="cmd"><span class="title">${esc(item.title)}</span>` +
           `<code>${esc(item.cmd)}</code>` +
           `<button data-cmd="${attr(item.cmd)}">コピー</button></div>`;
    });
  });
  document.getElementById("cmd").innerHTML = h;
  bindCopy(document.getElementById("cmd"));
}

function inlineCode(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/`(.+?)`/g, "<code>$1</code>");
}

function renderRules(d) {
  const r = d.rules || { meta: {}, groups: [] };
  const m = r.meta || {};
  let h = cards([
    { k: "コンペ", v: m.name || "—", cls: "" },
    { k: "対象", v: m.division || "—" },
    { k: "task key", v: (m.task_key || "—").slice(0, 8) },
    { k: "参照元", v: (r.source_files ? Object.values(r.source_files).filter(Boolean).length : 0) + " / 2" },
  ]);
  if (m.url) {
    h += `<p><a href="${esc(m.url)}" target="_blank" rel="noreferrer" style="color:var(--accent)">公式ページを開く（規約の正は公式ページ）</a></p>`;
  }

  h += '<div class="rule-card"><h3>出所</h3><div class="rule-groups">';
  (m.sources || []).forEach(s => {
    h += `<div class="rule-group"><div class="rule-group-title">${esc(s.label)}</div>` +
         `<ul class="rule-items"><li><code>${esc(s.path)}${s.lines ? ":" + esc(s.lines) : ""}</code></li>` +
         `<li>${esc(s.note || "")}</li></ul></div>`;
  });
  h += "</div>";
  if (m.note) h += `<p class="meta">${esc(m.note)}</p>`;
  h += "</div>";

  (r.groups || []).forEach(g => {
    h += `<div class="rule-card"><h3>${esc(g.title)}</h3><div class="rule-groups"><div class="rule-group">`;
    h += `<ul class="rule-items">`;
    (g.items || []).forEach(it => { h += `<li>${inlineCode(it)}</li>`; });
    h += "</ul></div></div></div>";
  });
  document.getElementById("rules").innerHTML = h;
}

const TRAJ_SLOT_COLORS = ["#58a6ff", "#3fb950", "#d29922", "#a371f7"];
const TRAJ_RING_COLORS = { radar: "rgba(88,166,255,0.20)", irst: "rgba(163,113,247,0.18)", mws: "rgba(248,81,73,0.35)" };
const traj = { entries: [], data: null, log: null, t: 0, playing: false, timer: null,
               speed: 2, span: 300, rings: true, trail: true };

function trajColor(slot) {
  const i = traj.data ? traj.data.slots.indexOf(slot) : -1;
  return TRAJ_SLOT_COLORS[(i < 0 ? 0 : i) % TRAJ_SLOT_COLORS.length];
}

async function loadTrajEntries(force) {
  const box = document.getElementById("traj");
  if (!box) return;
  if (!force && traj.entries.length) return;
  box.innerHTML = '<div class="empty">軌跡データを読み込み中…</div>';
  let payload;
  try {
    const res = await fetch("/api/replays", { cache: "no-store" });
    payload = await res.json();
  } catch (err) {
    box.innerHTML = '<div class="empty">読み込み失敗: ' + esc(err) + '</div>';
    return;
  }
  traj.entries = payload.entries || [];
  if (payload.error) {
    box.innerHTML = '<div class="empty">' + esc(payload.error) + '</div>';
    return;
  }
  if (!traj.entries.length) {
    box.innerHTML = '<div class="empty">再生可能なログがありません。<br>'
      + '軌跡の復元は自作エージェント（EscortHunterAgent）のログのみ対象です。'
      + 'BenchMark 同士のログは observation がスカラー構造で位置情報を持たないため再生できません。</div>';
    return;
  }
  buildTrajShell();
  const keep = traj.entries.some(e => e.log === traj.log);
  const target = keep ? traj.log : traj.entries[0].log;
  document.getElementById("traj-sel").value = target;
  await openTraj(target);
}

function buildTrajShell() {
  const opts = traj.entries.map(e =>
    `<option value="${esc(e.log)}">${esc(e.log + "  " + e.mtime + "  " + e.frames + "ステップ"
      + (e.has_ammo ? "" : "（残弾列なし）"))}</option>`).join("");
  document.getElementById("traj").innerHTML = `
    <div class="traj-controls">
      <select id="traj-sel">${opts}</select>
      <button id="traj-reload">再読み込み</button>
      <span class="meta">再生可能なログ ${traj.entries.length} 本</span>
    </div>
    <div class="traj-wrap">
      <div class="traj-stage">
        <canvas id="traj-canvas"></canvas>
        <div class="traj-controls">
          <button id="traj-play">▶ 再生</button>
          <input type="range" id="traj-seek" min="0" max="0" value="0">
          <span class="meta" id="traj-time">0 / 0</span>
          <select id="traj-speed">
            <option value="1">1×</option><option value="2" selected>2×</option>
            <option value="4">4×</option><option value="8">8×</option>
          </select>
          <select id="traj-span">
            <option value="80">80 km</option><option value="150">150 km</option>
            <option value="300" selected>300 km（全域）</option>
          </select>
          <label><input type="checkbox" id="traj-rings" checked>センサリング</label>
          <label><input type="checkbox" id="traj-trail" checked>軌跡</label>
        </div>
        <div class="traj-legend" id="traj-legend"></div>
      </div>
      <div class="traj-side">
        <div id="traj-info"></div>
        <h2>イベント（クリックでジャンプ）</h2>
        <div class="traj-events" id="traj-events"></div>
      </div>
    </div>
    <p class="traj-note">陣営座標系（km）。x=+ は敵陣方向、y=+ は反時計回り側。プロットは自機編隊の中心に追従。
      敵の点は <code>own + dist·(cos bearing, sin bearing)</code> で復元した推定位置で、
      <b>そのフレームで当該機が探知していた敵だけ</b>を表示します（ undetected の敵は出ません）。
      ▲ は自機の位置と進行方位、リングはレーダ 80 km / IRST 120 km / MWS 10 km、
      赤線は被弾警報の方位です。高度はユース部門で固定のため平面表示です。</p>`;

  document.getElementById("traj-sel").addEventListener("change", e => openTraj(e.target.value));
  document.getElementById("traj-reload").addEventListener("click", () => loadTrajEntries(true));
  document.getElementById("traj-play").addEventListener("click", toggleTraj);
  document.getElementById("traj-seek").addEventListener("input", e => {
    traj.t = Number(e.target.value); drawTraj();
  });
  document.getElementById("traj-speed").addEventListener("change", e => { traj.speed = Number(e.target.value); });
  document.getElementById("traj-span").addEventListener("change", e => { traj.span = Number(e.target.value); drawTraj(); });
  document.getElementById("traj-rings").addEventListener("change", e => { traj.rings = e.target.checked; drawTraj(); });
  document.getElementById("traj-trail").addEventListener("change", e => { traj.trail = e.target.checked; drawTraj(); });
}

async function openTraj(log) {
  const btn = document.getElementById("traj-play");
  if (btn) { traj.playing = false; clearInterval(traj.timer); traj.timer = null; btn.textContent = "▶ 再生"; }
  const info = document.getElementById("traj-info");
  if (info) info.innerHTML = '<div class="empty">読み込み中…</div>';
  let payload;
  try {
    const res = await fetch("/api/replay?log=" + encodeURIComponent(log), { cache: "no-store" });
    payload = await res.json();
  } catch (err) {
    if (info) info.innerHTML = '<div class="empty">読み込み失敗: ' + esc(err) + '</div>';
    return;
  }
  if (payload.error) {
    if (info) info.innerHTML = '<div class="empty">' + esc(payload.error) + '</div>';
    return;
  }
  traj.data = payload;
  traj.log = log;
  traj.t = 0;
  const seek = document.getElementById("traj-seek");
  seek.max = Math.max(0, payload.frame_count - 1);
  seek.value = 0;
  renderTrajLegend();
  renderTrajEvents();
  drawTraj();
}

function toggleTraj() {
  const btn = document.getElementById("traj-play");
  traj.playing = !traj.playing;
  btn.textContent = traj.playing ? "❚❚ 一時停止" : "▶ 再生";
  clearInterval(traj.timer);
  traj.timer = null;
  if (!traj.playing) return;
  traj.timer = setInterval(() => {
    if (!traj.data) return;
    const last = traj.data.frame_count - 1;
    traj.t = traj.t >= last ? 0 : Math.min(last, traj.t + traj.speed);
    document.getElementById("traj-seek").value = traj.t;
    drawTraj();
  }, 50);
}

function renderTrajLegend() {
  const d = traj.data;
  const items = d.slots.map(s =>
    `<span><span class="sw" style="background:${trajColor(s)}"></span>${esc(s)}号</span>`).join("");
  const rings = Object.keys(d.sensor_ranges || {}).map(k =>
    `<span><span class="sw" style="background:${TRAJ_RING_COLORS[k]}"></span>${esc(k)} ${d.sensor_ranges[k]} km</span>`).join("");
  document.getElementById("traj-legend").innerHTML =
    `<span><span class="sw" style="background:#f85149"></span>被弾警報</span>`
    + `<span><span class="sw" style="background:#e6edf3"></span>探知した敵</span>`
    + `<span><span class="sw" style="background:#ffd33d"></span>護衛対象機フラグ</span>`
    + items + rings;
}

function renderTrajEvents() {
  const box = document.getElementById("traj-events");
  const events = traj.data.events || [];
  if (!events.length) {
    box.innerHTML = '<div class="empty">イベントなし</div>';
    return;
  }
  box.innerHTML = events.map((e, i) =>
    `<div data-i="${i}" data-t="${e.t}">t=${String(e.t).padStart(4)} ${esc(e.kind)} ${esc(e.text)}</div>`).join("");
  box.querySelectorAll("div[data-t]").forEach(el => {
    el.addEventListener("click", () => {
      traj.t = Number(el.dataset.t);
      document.getElementById("traj-seek").value = traj.t;
      drawTraj();
    });
  });
}

function trajFoeCount(frame) {
  const seen = {};
  (frame.enemy || []).forEach(e => {
    const key = Math.round(e.x) + ":" + Math.round(e.y);
    seen[key] = true;
  });
  return Object.keys(seen).length;
}

function drawTraj() {
  const canvas = document.getElementById("traj-canvas");
  const d = traj.data;
  if (!canvas || !d || !d.frames.length) return;
  if (!canvas.clientWidth) return;
  const cssW = canvas.clientWidth;
  const cssH = Math.max(360, Math.round(cssW * 0.62));
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + "px";
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, cssW, cssH);

  const frame = d.frames[Math.min(traj.t, d.frames.length - 1)];
  const own = Object.values(frame.own || {}).filter(p => p.x !== null && p.y !== null);
  let cx = 0, cy = 0;
  if (own.length) {
    cx = own.reduce((a, p) => a + p.x, 0) / own.length;
    cy = own.reduce((a, p) => a + p.y, 0) / own.length;
  }
  const scale = Math.min(cssW, cssH) / traj.span;
  const X = x => cssW / 2 + (x - cx) * scale;
  const Y = y => cssH / 2 - (y - cy) * scale;

  ctx.strokeStyle = "rgba(147,161,176,0.16)";
  ctx.lineWidth = 1;
  ctx.font = "10px Consolas, monospace";
  ctx.fillStyle = "rgba(147,161,176,0.55)";
  const step = traj.span > 200 ? 50 : 25;
  for (let g = -300; g <= 300; g += step) {
    const sx = X(g), sy = Y(g);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, cssH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cssW, sy); ctx.stroke();
    if (sx > 12 && sx < cssW - 30) ctx.fillText(String(g), sx + 3, cssH - 6);
    if (sy > 12 && sy < cssH - 6) ctx.fillText(String(g), 6, sy - 3);
  }
  ctx.fillStyle = "rgba(147,161,176,0.8)";
  ctx.fillText("x=+ 敵陣側 →", cssW - 96, 14);
  ctx.fillText("← x=- 自陣側", 8, cssH - 20);

  if (traj.rings) {
    Object.entries(d.sensor_ranges || {}).forEach(([k, km]) => {
      ctx.strokeStyle = TRAJ_RING_COLORS[k] || "rgba(147,161,176,0.2)";
      own.forEach(p => {
        ctx.beginPath();
        ctx.arc(X(p.x), Y(p.y), km * scale, 0, Math.PI * 2);
        ctx.stroke();
      });
    });
  }

  if (traj.trail) {
    d.slots.forEach(slot => {
      ctx.strokeStyle = trajColor(slot) + "80";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i <= traj.t && i < d.frames.length; i++) {
        const p = d.frames[i].own[slot];
        if (!p || p.x === null || p.y === null) { started = false; continue; }
        const sx = X(p.x), sy = Y(p.y);
        if (!started) { ctx.moveTo(sx, sy); started = true; } else { ctx.lineTo(sx, sy); }
      }
      ctx.stroke();
    });
  }

  (frame.enemy || []).forEach(e => {
    const sx = X(e.x), sy = Y(e.y);
    const src = frame.own[e.slot];
    if (src && src.x !== null) {
      ctx.strokeStyle = "rgba(230,237,243,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(src.x), Y(src.y)); ctx.lineTo(sx, sy); ctx.stroke();
    }
    ctx.fillStyle = e.escort ? "#ffd33d" : "#e6edf3";
    ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, Math.PI * 2); ctx.fill();
  });

  (frame.threat || []).forEach(th => {
    const src = frame.own[th.slot];
    if (!src || src.x === null) return;
    const rad = (th.bearing || 0) * Math.PI / 180;
    const len = (d.sensor_ranges.mws || 10) * scale;
    const ax = X(src.x), ay = Y(src.y);
    const bx = ax + Math.cos(rad) * len, by = ay - Math.sin(rad) * len;
    ctx.strokeStyle = "#f85149";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = "#f85149";
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();
  });

  Object.entries(frame.own || {}).forEach(([slot, p]) => {
    if (p.x === null || p.y === null) return;
    const sx = X(p.x), sy = Y(p.y), col = trajColor(slot);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-(p.heading || 0) * Math.PI / 180);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-5, 5); ctx.lineTo(-2, 0); ctx.lineTo(-5, -5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = col;
    ctx.font = "11px Consolas, monospace";
    ctx.fillText(slot + "号", sx + 9, sy - 6);
  });

  (frame.events || []).forEach(ev => {
    const p = frame.own[ev.slot];
    if (!p || p.x === null) return;
    ctx.strokeStyle = ev.kind === "lost" ? "#f85149" : "#58a6ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 16, 0, Math.PI * 2); ctx.stroke();
  });

  document.getElementById("traj-seek").value = traj.t;
  document.getElementById("traj-time").textContent = `${traj.t + 1} / ${d.frame_count}  （ptime ${frame.ptime}s）`;
  const r = d.result || {};
  const alive = Object.keys(frame.own || {}).length;
  document.getElementById("traj-info").innerHTML = cards([
    { k: "ログ", v: (d.log || "").split("/").slice(-2).join("/") },
    { k: "自機応答", v: alive + " / " + d.slots.length, cls: alive < d.slots.length ? "warn" : "ok" },
    { k: "推定敵位置", v: trajFoeCount(frame) },
    { k: "このフレームのイベント", v: (frame.events || []).length },
    { k: "終了理由", v: r.endReason || "—" },
    { k: "自陣スコア", v: r.own ? num(r.scores ? r.scores[r.own] : null, 3) : "—" },
    { k: "命中率", v: r.hit_rate === null || r.hit_rate === undefined ? "—" : num(r.hit_rate, 3) },
    { k: "生存（自/敵）", v: r.numAlives ? `${r.numAlives.Red ?? "—"} / ${r.numAlives.Blue ?? "—"}` : "—" },
  ]);

  const box = document.getElementById("traj-events");
  if (box) {
    box.querySelectorAll("div[data-t]").forEach(el => {
      el.classList.toggle("cur", Number(el.dataset.t) === traj.t);
    });
  }
}

function renderHistoryChart(history) {
  const svg = document.getElementById("hist-chart");
  const legend = document.getElementById("hist-legend");
  if (!svg || !history.length) return;
  const metricBtns = document.querySelectorAll("[data-hist-metric]");
  let metric = "avg_score";
  metricBtns.forEach(b => { if (b.classList.contains("active")) metric = b.dataset.histMetric; });
  metricBtns.forEach(b => {
    b.onclick = () => {
      metricBtns.forEach(x => x.classList.toggle("active", x === b));
      renderHistoryChart(history);
    };
  });

  // get series by label
  const seriesMap = {};
  history.forEach((hf, idx) => {
    const m = hf.metrics || {};
    const lbl = m.label || hf.name || `series-${idx}`;
    if (!seriesMap[lbl]) seriesMap[lbl] = [];
    let v = null;
    if (metric === "avg_score") v = (m.avg_score === null || m.avg_score === undefined) ? null : Number(m.avg_score);
    if (metric === "win_rate") {
      const g = Number(m.games || 0);
      const w = Number(m.win || 0); v = g > 0 ? (w / g) * 100 : null;
    }
    if (metric === "avg_our_alive") v = (m.avg_our_alive === null || m.avg_our_alive === undefined) ? null : Number(m.avg_our_alive);
    if (metric === "avg_enemy_alive") v = (m.avg_enemy_alive === null || m.avg_enemy_alive === undefined) ? null : Number(m.avg_enemy_alive);
    seriesMap[lbl].push({ idx, v, mtime: hf.mtime, games: m.games, wdl: `${m.win||0}/${m.draw||0}/${m.loss||0}` });
  });
  const series = Object.entries(seriesMap).map(([name, pts]) => ({ name, pts }));

  const W = 960, H = 240, M = { l: 40, r: 20, t: 20, b: 40 };
  const w = W - M.l - M.r, h = H - M.t - M.b;
  let allVals = [];
  series.forEach(s => s.pts.forEach(p => { if (p.v !== null) allVals.push(p.v); }));
  let vmin = allVals.length ? Math.min(...allVals) : 0;
  let vmax = allVals.length ? Math.max(...allVals) : 1;
  if (vmax === vmin) { vmax = vmin + 0.01; }
  // padding
  const pad = (vmax - vmin) * 0.1 || 0.05;
  vmin -= pad; vmax += pad;
  const x = (i) => M.l + (history.length <= 1 ? w/2 : i * (w / (history.length - 1)));
  const y = (v) => M.t + h - ((v - vmin) / (vmax - vmin)) * h;

  let svgStr = `
<defs>
  <style>.axis{stroke:var(--muted);stroke-width:1;opacity:.5}.tick{font-size:10px;fill:var(--muted);font-family:Consolas,monospace}.line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}.pt{stroke-width:1.5;fill:var(--bg)}</style>
</defs>
<line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${M.t+h}" class="axis"/>
<line x1="${M.l}" y1="${M.t+h}" x2="${M.l+w}" y2="${M.t+h}" class="axis"/>`;

  // ticks y
  const yticks = 4;
  for (let i = 0; i <= yticks; i++) {
    const tv = vmin + (vmax - vmin) * (i / yticks);
    const yy = y(tv);
    svgStr += `<line x1="${M.l-3}" y1="${yy}" x2="${M.l}" y2="${yy}" class="axis"/>`;
    const fmt = (metric === "win_rate") ? Math.round(tv*10)/10 : (tv >= 10 ? Math.round(tv) : Math.round(tv*100)/100);
    svgStr += `<text x="${M.l-6}" y="${yy+3}" text-anchor="end" class="tick">${fmt}</text>`;
  }
  // ticks x (max 6)
  const xt = Math.min(history.length, 6);
  for (let i = 0; i < xt; i++) {
    const idx = Math.floor(i * (history.length - 1) / Math.max(1, xt-1));
    const xx = x(idx);
    const hf = history[idx];
    svgStr += `<line x1="${xx}" y1="${M.t+h}" x2="${xx}" y2="${M.t+h+3}" class="axis"/>`;
    const mtimeStr = hf.mtime || "";
    const t = mtimeStr.includes("T") ? mtimeStr.slice(5,16).replace("T"," ") : mtimeStr.slice(5,16); // MM-DD HH:MM
    svgStr += `<text x="${xx}" y="${M.t+h+14}" text-anchor="middle" class="tick">${t}</text>`;
  }

  const colors = ["#58a6ff","#3fb950","#d2a8ff","#ff7b72","#ffa657","#f85149","#79c0ff"];
  series.forEach((s, si) => {
    const col = colors[si % colors.length];
    let path = "";
    s.pts.forEach((p, i) => {
      if (p.v === null) return;
      
    });
    // better: use original index
    path = "";
    history.forEach((hf, hi) => {
      const pp = s.pts.find(p => p.mtime === hf.mtime);
      if (!pp || pp.v === null) return;
      const off = (si - (series.length-1)/2) * 1.5;
      const cmd = path === "" ? "M" : "L";
      path += cmd + (x(hi) + off) + "," + y(pp.v) + " ";
    });
    svgStr += `<path d="${path.trim()}" class="line" stroke="${col}"/>`;
  });
  // points
  series.forEach((s, si) => {
    const col = colors[si % colors.length];
    history.forEach((hf, hi) => {
      const pp = s.pts.find(p => p.mtime === hf.mtime);
      if (!pp || pp.v === null) return;
      const off = (si - (series.length-1)/2) * 3;
      svgStr += `<circle cx="${x(hi) + off}" cy="${y(pp.v)}" r="2.5" class="pt" stroke="${col}" fill="${col}"><title>${s.name} / ${hf.mtime}: ${pp.v.toFixed(3)} (${pp.wdl}, ${pp.games||0}戦)</title></circle>`;
    });
  });

  svg.innerHTML = svgStr;
  // legend
  if (legend) {
    legend.innerHTML = series.map((s, si) => {
      const col = colors[si % colors.length];
      return `<div style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:2px;background:${col};display:inline-block"></span><span class="muted">${esc(s.name)}</span></div>`;
    }).join("");
  }
}

function showTab(key) {
  TABS.forEach(([k]) => {
    document.getElementById("nav-" + k).classList.toggle("active", k === key);
    document.getElementById("tab-" + k).classList.toggle("active", k === key);
  });
  location.hash = key;
  if (key === "traj") {
    loadTrajEntries(false);
    if (traj.data) drawTraj();
  }
}

function buildNav() {
  TABS.forEach(([k, label]) => {
    const b = document.createElement("button");
    b.id = "nav-" + k; b.textContent = label;
    b.addEventListener("click", () => showTab(k));
    nav.appendChild(b);
  });
}

async function load(force) {
  try {
    const res = await fetch("/api/summary" + (force ? "?force=1" : ""), { cache: "no-store" });
    const data = await res.json();
    state.data = data;
    document.getElementById("stamp").textContent = "更新 " + data.generated_at;
    // Compute evidence diffs before rendering
    markEvidenceDiffs(data);
    renderEnv(data); renderSub(data); renderEval(data); renderLogs(data);
    renderHypothesis(data); renderSession(data); renderGit(data); renderCmd(data); renderRules(data);
  } catch (err) {
    document.getElementById("stamp").textContent = "読み込み失敗: " + err;
  }
}

function markEvidenceDiffs(data) {
  if (!data.session?.evidence) return;
  const prev = JSON.parse(localStorage.getItem("prev_evidence") || "{}");
  const curr = {};
  data.session.evidence.forEach(card => {
    const cardId = card.id || card.title;
    curr[cardId] = card.evidence || [];
    const prevCard = prev[cardId] || [];
    (card.evidence || []).forEach((e, i) => {
      const prevE = prevCard.find(p => p.label === e.label);
      if (!prevE) {
        e._diff = "new";
      } else if (prevE.value !== e.value) {
        e._diff = "changed";
        e._prevValue = prevE.value;
      }
    });
  });
  localStorage.setItem("prev_evidence", JSON.stringify(curr));
}

buildNav();
showTab((location.hash || "#git").slice(1));
window.addEventListener("hashchange", () => showTab((location.hash || "#git").slice(1)));
window.addEventListener("resize", () => { if (traj.data) drawTraj(); });
load(false);
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("auto").addEventListener("change", () => schedule());
document.getElementById("interval").addEventListener("change", () => schedule());
function schedule() {
  clearInterval(state.timer);
  if (document.getElementById("auto").checked) {
    state.timer = setInterval(() => load(false), Number(document.getElementById("interval").value));
  }
}
schedule();
</script>

    showTab('git');
  });
