async function openTraj(log) {
  const btn = document.getElementById("traj-play");
  if (btn) { traj.playing = false; clearInterval(traj.timer); traj.timer = null; btn.textContent = "â¶ åç"; }
  const info = document.getElementById("traj-info");
  if (info) info.innerHTML = '<div class="empty">èª­ã¿è¾¼ã¿ä¸­â¦</div>';
  let payload;
  try {
    const res = await fetch("/api/replay?log=" + encodeURIComponent(log), { cache: "no-store" });
    payload = await res.json();
  } catch (err) {
    if (info) info.innerHTML = '<div class="empty">èª­ã¿è¾¼ã¿å¤±æ: ' + esc(err) + '</div>';
    return;
  }
  if (payload.error) {
    if (info) info.innerHTML = '<div class="empty">' + esc(payload.error) + '</div>';
    return;
  }
  traj.data = payload;
  traj.log = log;
  traj.t = 0;
  const seek = document.getElementById("traj-seek");
  seek.max = Math.max(0, payload.frame_count - 1);
  seek.value = 0;
  renderTrajLegend();
  renderTrajEvents();
  drawTraj();
}

function toggleTraj() {
  const btn = document.getElementById("traj-play");
  traj.playing = !traj.playing;
  btn.textContent = traj.playing ? "ââ ä¸æåæ­¢" : "â¶ åç";
  clearInterval(traj.timer);
  traj.timer = null;
  if (!traj.playing) return;
  traj.timer = setInterval(() => {
    if (!traj.data) return;
    const last = traj.data.frame_count - 1;
    traj.t = traj.t >= last ? 0 : Math.min(last, traj.t + traj.speed);
    document.getElementById("traj-seek").value = traj.t;
    drawTraj();
  }, 50);
}

function renderTrajEvents() {
  const box = document.getElementById("traj-events");

  if (!events.length) {
    box.innerHTML = '<div class="empty">ã¤ãã³ããªã</div>';

function trajFoeCount(frame) {
  const seen = {};
  (frame.enemy || []).forEach(e => {
    const key = Math.round(e.x) + ":" + Math.round(e.y);
    seen[key] = true;
  });
  return Object.keys(seen).length;
}

function drawTraj() {
  const canvas = document.getElementById("traj-canvas");
  const d = traj.data;
  if (!canvas || !d || !d.frames.length) return;
  if (!canvas.clientWidth) return;
  const cssW = canvas.clientWidth;
  const cssH = Math.max(360, Math.round(cssW * 0.62));
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + "px";
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, cssW, cssH);

  const frame = d.frames[Math.min(traj.t, d.frames.length - 1)];
  const own = Object.values(frame.own || {}).filter(p => p.x !== null && p.y !== null);
  let cx = 0, cy = 0;
  if (own.length) {
    cx = own.reduce((a, p) => a + p.x, 0) / own.length;
    cy = own.reduce((a, p) => a + p.y, 0) / own.length;
  }
  const scale = Math.min(cssW, cssH) / traj.span;
  const X = x => cssW / 2 + (x - cx) * scale;
  const Y = y => cssH / 2 - (y - cy) * scale;

  ctx.strokeStyle = "rgba(147,161,176,0.16)";
  ctx.lineWidth = 1;
  ctx.font = "10px Consolas, monospace";
  ctx.fillStyle = "rgba(147,161,176,0.55)";
  const step = traj.span > 200 ? 50 : 25;
  for (let g = -300; g <= 300; g += step) {
    const sx = X(g), sy = Y(g);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, cssH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cssW, sy); ctx.stroke();
    if (sx > 12 && sx < cssW - 30) ctx.fillText(String(g), sx + 3, cssH - 6);
    if (sy > 12 && sy < cssH - 6) ctx.fillText(String(g), 6, sy - 3);
  }
  ctx.fillStyle = "rgba(147,161,176,0.8)";
  ctx.fillText("x=+ æµé£å´ â", cssW - 96, 14);
  ctx.fillText("â x=- èªé£å´", 8, cssH - 20);

  if (traj.rings) {
    Object.entries(d.sensor_ranges || {}).forEach(([k, km]) => {
      ctx.strokeStyle = TRAJ_RING_COLORS[k] || "rgba(147,161,176,0.2)";
      own.forEach(p => {
        ctx.beginPath();
        ctx.arc(X(p.x), Y(p.y), km * scale, 0, Math.PI * 2);
        ctx.stroke();
      });
    });
  }

  if (traj.trail) {
    d.slots.forEach(slot => {
      ctx.strokeStyle = trajColor(slot) + "80";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i <= traj.t && i < d.frames.length; i++) {
        const p = d.frames[i].own[slot];
        if (!p || p.x === null || p.y === null) { started = false; continue; }
        const sx = X(p.x), sy = Y(p.y);
        if (!started) { ctx.moveTo(sx, sy); started = true; } else { ctx.lineTo(sx, sy); }
      }
      ctx.stroke();
    });
  }

  (frame.enemy || []).forEach(e => {
    const sx = X(e.x), sy = Y(e.y);
    const src = frame.own[e.slot];
    if (src && src.x !== null) {
      ctx.strokeStyle = "rgba(230,237,243,0.22)";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(src.x), Y(src.y)); ctx.lineTo(sx, sy); ctx.stroke();
    }
    ctx.fillStyle = e.escort ? "#ffd33d" : "#e6edf3";
    ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, Math.PI * 2); ctx.fill();
  });

  (frame.threat || []).forEach(th => {
    const src = frame.own[th.slot];
    if (!src || src.x === null) return;
    const rad = (th.bearing || 0) * Math.PI / 180;
    const len = (d.sensor_ranges.mws || 10) * scale;
    const ax = X(src.x), ay = Y(src.y);
    const bx = ax + Math.cos(rad) * len, by = ay - Math.sin(rad) * len;
    ctx.strokeStyle = "#f85149";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = "#f85149";
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();
  });

  Object.entries(frame.own || {}).forEach(([slot, p]) => {
    if (p.x === null || p.y === null) return;
    const sx = X(p.x), sy = Y(p.y), col = trajColor(slot);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-(p.heading || 0) * Math.PI / 180);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-5, 5); ctx.lineTo(-2, 0); ctx.lineTo(-5, -5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = col;
    ctx.font = "11px Consolas, monospace";
    ctx.fillText(slot + "å·", sx + 9, sy - 6);
  });

  (frame.events || []).forEach(ev => {
    const p = frame.own[ev.slot];
    if (!p || p.x === null) return;
    ctx.strokeStyle = ev.kind === "lost" ? "#f85149" : "#58a6ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 16, 0, Math.PI * 2); ctx.stroke();
  });

  document.getElementById("traj-seek").value = traj.t;
  document.getElementById("traj-time").textContent = `${traj.t + 1} / ${d.frame_count}  ï¼ptime ${frame.ptime}sï¼`;
  const r = d.result || {};
  const alive = Object.keys(frame.own || {}).length;
  document.getElementById("traj-info").innerHTML = cards([
    { k: "ã­ã°", v: (d.log || "").split("/").slice(-2).join("/") },
    { k: "èªæ©å¿ç­", v: alive + " / " + d.slots.length, cls: alive < d.slots.length ? "warn" : "ok" },
    { k: "æ¨å®æµä½ç½®", v: trajFoeCount(frame) },
    { k: "ãã®ãã¬ã¼ã ã®ã¤ãã³ã", v: (frame.events || []).length },
    { k: "çµäºçç±", v: r.endReason || "â" },
    { k: "èªé£ã¹ã³ã¢", v: r.own ? num(r.scores ? r.scores[r.own] : null, 3) : "â" },
    { k: "å½ä¸­ç", v: r.hit_rate === null || r.hit_rate === undefined ? "â" : num(r.hit_rate, 3) },
    { k: "çå­ï¼èª/æµï¼", v: r.numAlives ? `${r.numAlives.Red ?? "â"} / ${r.numAlives.Blue ?? "â"}` : "â" },
  ]);

  const box = document.getElementById("traj-events");
  box.querySelectorAll("div[data-t]").forEach(el => {
    el.classList.toggle("cur", Number(el.dataset.t) === traj.t);
  });
}

async function load(force) {
  try {
    const res = await fetch("/api/summary" + (force ? "?force=1" : ""), { cache: "no-store" });
    const data = await res.json();
    state.data = data;
    document.getElementById("stamp").textContent = "æ´æ° " + data.generated_at;
    // Compute evidence diffs before rendering
    markEvidenceDiffs(data);
    renderEnv(data); renderSub(data); renderEval(data); renderLogs(data);
    renderHypothesis(data); renderSession(data); renderGit(data); renderCmd(data); renderRules(data);
  } catch (err) {
    document.getElementById("stamp").textContent = "èª­ã¿è¾¼ã¿å¤±æ: " + err;
  }
}

function markEvidenceDiffs(data) {
  if (!data.session?.evidence) return;
  const prev = JSON.parse(localStorage.getItem("prev_evidence") || "{}");
  const curr = {};
  data.session.evidence.forEach(card => {
    const cardId = card.id || card.title;
    curr[cardId] = card.evidence || [];
    const prevCard = prev[cardId] || [];
    (card.evidence || []).forEach((e, i) => {
      const prevE = prevCard.find(p => p.label === e.label);
      if (!prevE) {
        e._diff = "new";
      } else if (prevE.value !== e.value) {
        e._diff = "changed";
        e._prevValue = prevE.value;
      }
    });
  });
  localStorage.setItem("prev_evidence", JSON.stringify(curr));
}
