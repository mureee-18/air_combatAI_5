[project]
name = "air-combat-ai-5"
version = "0.1.0"
description = "Agent for SIGNATE 5th Air Combat AI Challenge (youth division)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "lefthook>=2.2.2",
    "pytest>=8",
    "ruff>=0.15.22",
]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "workspace",
    "submission",
    ".venv",
]
# PR / 実験の証跡として残している使い捨てスクリプト（lint・整形の対象外）
extend-exclude = [
    "docs/pr",
    "docs/exp",
]

[tool.ruff.lint]
select = ["E", "F"]
