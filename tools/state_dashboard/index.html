/* 射撃レイヤー（自機視点 / 戦場俯瞰 共通）。
   aim は action.target が非0の間の「ロック中」表示: 照準線＋矢印＋距離、
   先端にブラケット。escort（護衛対象機）は金色リングを重ねる。
   srcAt = (slot) => その機のこのフレームの座標（なければ null）。
*/
function drawAimLayer(ctx, frame, X, Y, srcAt) {
  (frame.aim || []).forEach(a => {
    const src = srcAt(a.slot);
    const sx = (src && src.x !== null && src.x !== undefined) ? X(src.x) : null;
    const sy = (src && src.y !== null && src.y !== undefined) ? Y(src.y) : null;
    const tx = X(a.x), ty = Y(a.y);
    const col = trajColor(a.slot);
    if (sx !== null && sy !== null) {
      const dx = tx - sx, dy = ty - sy;
      const l = Math.hypot(dx, dy);
      if (l > 0.1) {
        const ux = dx / l, uy = dy / l;
        // ロック線は各機のスロット色の破線（実線の編隊軌跡と破線なら区別でき、同色同士で埋もれない）
        ctx.save();
        ctx.setLineDash([5, 3]);
        ctx.strokeStyle = col + "cc";
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(tx, ty); ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(tx, ty);
        ctx.lineTo(tx - ux * 8 + uy * 4, ty - uy * 8 - ux * 4);
        ctx.lineTo(tx - ux * 8 - uy * 4, ty - uy * 8 + ux * 4);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = col;
        ctx.font = "10px Consolas, monospace";
        ctx.fillText(`ロック ${num(a.dist, 0)} km`, (sx + tx) / 2 - uy * 15 + 2, (sy + ty) / 2 + ux * 15);
      }
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(tx, ty, 5, 0, Math.PI * 2); ctx.stroke();
    if (a.escort) {
      ctx.strokeStyle = "#ffd33d";
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(tx, ty, 8, 0, Math.PI * 2); ctx.stroke();
    }
  });
}

/* 飛翔中の誘導弾レイヤー（自機視点 / 戦場俯瞰 共通）。
   弾の座標はログに無いので発射点→照準点を直線補間して復元。
   - 弾の後ろに**過去の位置（軌跡）**を薄く描いて進行方向を見せる
   - 発射時点で照準点に最も近い融合敵を「撃った相手」とし、ラベルに `→ E4` と表示
     （敵は移動するので、弾が届く頃には照準点から離れていて「空振り」に見えることがある、という意味も込めている）
*/
const shotTargetCache = {};

function drawShotsLayer(ctx, d, frame, X, Y, scale) {
  (frame.shots || []).forEach(s => {
    const col = trajColor(s.slot);
    const sfx = s.fx, sfy = s.fy;
    const stx = s.tx, sty = s.ty;
    if (stx !== null && stx !== undefined && sty !== null && sty !== undefined) {
      ctx.save();
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = col + "40";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(sfx), Y(sfy)); ctx.lineTo(X(stx), Y(sty)); ctx.stroke();
      ctx.restore();
      // 軌跡（直線補間の過去位置を段階的に再現）
      const steps = Math.min(14, Math.floor(s.age) + 1);
      for (let k = steps; k >= 1; k--) {
        const a1 = Math.max(0, s.age - k), a2 = Math.max(0, s.age - k + 1);
        const p1 = s.flight > 0 ? a1 / s.flight : 0;
        const p2 = s.flight > 0 ? a2 / s.flight : 0;
        ctx.strokeStyle = col + (Math.round(102 * (1 - (k - 1) / steps)).toString(16).padStart(2, "0"));
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.moveTo(X(sfx + (stx - sfx) * p1), Y(sfy + (sty - sfy) * p1));
        ctx.lineTo(X(sfx + (stx - sfx) * p2), Y(sfy + (sty - sfy) * p2));
        ctx.stroke();
      }
      ctx.strokeStyle = col + "e6";
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(sfx), Y(sfy)); ctx.lineTo(X(s.x), Y(s.y)); ctx.stroke();
      // 弾の実線（発射点→現在）: 目標ロストリングと同じ太さ（1.5px）に細い白縁取り
      ctx.lineCap = "round";
      ctx.strokeStyle = "rgba(255,255,255,0.35)";
      ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(X(sfx), Y(sfy)); ctx.lineTo(X(s.x), Y(s.y)); ctx.stroke();
      ctx.strokeStyle = col;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(sfx), Y(sfy)); ctx.lineTo(X(s.x), Y(s.y)); ctx.stroke();
      ctx.lineCap = "butt";
      // 照準点: 白リング＋スロット色
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(X(stx), Y(sty), 5.4, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(X(stx), Y(sty), 3, 0, Math.PI * 2); ctx.fill();
    }
    if (s.age <= 2) {
      ctx.strokeStyle = col + "cc";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X(sfx), Y(sfy), 9 + s.age * 3, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = col;
      ctx.font = "10px Consolas, monospace";
      ctx.fillText("発射!", X(sfx) + 13, Y(sfy) - 13);
    }
    const sx = X(s.x), sy = Y(s.y);
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(sx, sy, 5.6, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(sx, sy, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(11,15,20,0.9)";
    ctx.font = "8px Consolas, monospace";
    ctx.fillText("弾", sx - 4, sy + 4);
    const key = s.slot + "@" + s.t0;
    if (!(key in shotTargetCache)) {
      let target = null;
      if (stx !== null && stx !== undefined) {
        const tf = d.frames[Math.min(s.t0, d.frames.length - 1)];
        let best = null, bestD = 5;
        (tf.teams || []).forEach(t => {
          if (t.side !== "enemy") return;
          const dd = Math.hypot(t.x - stx, t.y - sty);
          if (dd < bestD) { best = t.id; bestD = dd; }
        });
        target = best;
      }
      shotTargetCache[key] = target;
    }
    ctx.fillStyle = col;
    ctx.font = "10px Consolas, monospace";
    const tgt = shotTargetCache[key];
    ctx.fillText(`${s.slot}号${tgt ? "→" + tgt : ""} ${num(s.age, 0)}s/${num(s.flight, 0)}s`, sx + 7, sy - 6);
  });
}

function drawBattleIcon(ctx, x, y, heading, color, kind) {
  ctx.save();
  ctx.translate(x, y);
  if (heading !== null && heading !== undefined) ctx.rotate(-heading * Math.PI / 180);
  ctx.fillStyle = color;
  ctx.beginPath();
  if (kind === "own") {
    ctx.moveTo(9, 0); ctx.lineTo(-5, 5); ctx.lineTo(-2, 0); ctx.lineTo(-5, -5);
  } else {
    ctx.moveTo(7, 0); ctx.lineTo(0, 7); ctx.lineTo(-7, 0); ctx.lineTo(0, -7);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBattle() {
  const canvas = document.getElementById("battle-canvas");
  const d = battle.data;
  const span = 150;
  if (!canvas || !d || !d.frames.length) return;
  if (!canvas.clientWidth) return;
  const cssW = canvas.clientWidth;
  const cssH = Math.max(360, Math.round(cssW * 0.62));
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + "px";
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, cssW, cssH);

  const scale = Math.min(cssW, cssH) / span;
  const X = x => cssW / 2 + x * scale;
  const Y = y => cssH / 2 - y * scale;

  ctx.strokeStyle = "rgba(147,161,176,0.16)";
  ctx.lineWidth = 1;
  ctx.font = "10px Consolas, monospace";
  ctx.fillStyle = "rgba(147,161,176,0.55)";
  for (let g = -300; g <= 300; g += 50) {
    const sx = X(g), sy = Y(g);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, cssH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cssW, sy); ctx.stroke();
    if (sx > 12 && sx < cssW - 30) ctx.fillText(String(g), sx + 3, cssH - 6);
    if (sy > 12 && sy < cssH - 6) ctx.fillText(String(g), 6, sy - 3);
  }

  const bounds = d.bounds || { x: 150, y: 150 };
  {
    const bx0 = X(-bounds.x), bx1 = X(bounds.x);
    const by0 = Y(bounds.y), by1 = Y(-bounds.y);
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "rgba(210,153,34,0.6)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(Math.min(bx0, bx1), Math.min(by0, by1), Math.abs(bx1 - bx0), Math.abs(by1 - by0));
    ctx.restore();
  }

  const frame = d.frames[Math.min(battle.t, d.frames.length - 1)];
  pushFrameToasts(battle, frame);
  const drawTrail = (side, color, width) => {
    if (!battle.trail) return;
    const byId = {};
    for (let i = 0; i <= battle.t; i++) {
      (d.frames[i].teams || []).forEach(t => {
        if (t.side !== side || t.x === null || t.x === undefined) return;
        (byId[t.id] = byId[t.id] || []).push([t.x, t.y]);
      });
    }
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    Object.values(byId).forEach(pts => {
      ctx.beginPath();
      let started = false;
      pts.forEach(p => {
        const sx = X(p[0]), sy = Y(p[1]);
        if (!started) { ctx.moveTo(sx, sy); started = true; } else { ctx.lineTo(sx, sy); }
      });
      ctx.stroke();
    });
  };
  drawTrail("own", "rgba(88,166,255,0.30)", 1.4);
  drawTrail("enemy", "rgba(248,81,73,0.32)", 1.4);

  drawAimLayer(ctx, frame, X, Y, slot => (frame.own || {})[slot] || null);

  if (battle.threat) {
    (frame.threat || []).forEach(th => {
      const src = (frame.own || {})[th.slot];
      if (!src || src.x === null) return;
      const rad = (th.bearing || 0) * Math.PI / 180;
      const len = (d.sensor_ranges.mws || 10) * scale;
      const ax = X(src.x), ay = Y(src.y);
      ctx.strokeStyle = "#f85149";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + Math.cos(rad) * len, ay - Math.sin(rad) * len); ctx.stroke();
    });
  }

  if (battle.shots) {
    drawShotsLayer(ctx, d, frame, X, Y, scale);
  }

  (frame.events || []).forEach(ev => {
    const p = (frame.own || {})[ev.slot];
    if (!p || p.x === null) return;
    ctx.strokeStyle = TRAJ_EVENT_COLORS[ev.kind] || "#58a6ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 16, 0, Math.PI * 2); ctx.stroke();
  });

  drawEventToasts(ctx, battle);

  let nOwn = 0, nEnemy = 0;
  (frame.teams || []).forEach(t => {
    const sx = X(t.x), sy = Y(t.y);
    if (t.side === "own") {
      drawBattleIcon(ctx, sx, sy, t.heading, "#58a6ff", "own");
      nOwn += 1;
      ctx.fillStyle = "#58a6ff";
      ctx.font = "11px Consolas, monospace";
      ctx.fillText(t.id + "号", sx + 9, sy - 6);
      const am = (frame.own || {})[t.id];
      if (am && am.ammo !== undefined && am.ammo !== null) {
        ctx.fillStyle = am.ammo > 0 ? "rgba(147,161,176,0.85)" : "rgba(248,81,73,0.75)";
        ctx.font = "9px Consolas, monospace";
        ctx.fillText(`残弾${num(am.ammo, 0)}`, sx + 9, sy + 10);
      }
    } else {
      drawBattleIcon(ctx, sx, sy, t.heading, "#f85149", "enemy");
      nEnemy += 1;
      ctx.fillStyle = "rgba(248,81,73,0.9)";
      ctx.font = "11px Consolas, monospace";
      ctx.fillText(t.source === "direct" ? t.id : String(t.seen_by || 1) + "機検知 " + t.id, sx + 9, sy + 12);
    }
  });

  document.getElementById("battle-seek").value = battle.t;
  document.getElementById("battle-time").textContent = `${battle.t + 1} / ${d.frame_count}  （ptime ${frame.ptime}s）`;
  const r = d.result || {};
  document.getElementById("battle-info").innerHTML = cards([
    { k: "ログ", v: (d.log || "").split("/").slice(-2).join("/") },
    { k: "自軍生存", v: nOwn + " / " + d.slots.length, cls: nOwn < d.slots.length ? "warn" : "ok" },
    { k: "敵軍表示中", v: nEnemy + " 機", cls: nEnemy ? "ok" : "warn" },
    { k: "終了理由", v: r.endReason || "—" },
    { k: "自陣スコア", v: r.own ? num(r.scores ? r.scores[r.own] : null, 3) : "—" },
    { k: "命中率", v: r.hit_rate === null || r.hit_rate === undefined ? "—" : num(r.hit_rate, 3) },
    { k: "命中数", v: r.hit_count === null || r.hit_count === undefined ? "—" : num(r.hit_count, 0) },
    { k: "初弾命中", v: r.first_shot_hit === null || r.first_shot_hit === undefined ? "—" : (r.first_shot_hit ? "命中" : "不命中") },
    { k: "初発距離", v: r.first_shot_distance === null || r.first_shot_distance === undefined ? "—" : num(r.first_shot_distance, 1) + " km" },
    { k: "生存（自/敵）", v: r.numAlives ? `${r.numAlives.Red ?? "—"} / ${r.numAlives.Blue ?? "—"}` : "—" },
  ]);
  const rows = (frame.teams || []).map(t => [
    `<span style="color:${t.side === "own" ? "#58a6ff" : "#f85149"}">${esc(t.id)}${t.side === "own" ? "号" : ""}</span>`,
    t.side === "own" ? "自軍" : "敵軍",
    t.side === "own" ? "ログ実測" : (t.source === "direct" ? "ログ実測（絶対座標）" : (t.seen_by ? `${t.seen_by} 機の探知を融合` : "—")),
    t.x === null || t.x === undefined ? "—" : `${num(t.x, 0)}, ${num(t.y, 0)}`,
    t.heading === null || t.heading === undefined ? "—" : `${num(t.heading, 0)}°`,
  ]);
  document.getElementById("battle-info").innerHTML += "<h2>機体一覧</h2>" + table([
    { label: "機体" },
    { label: "陣営" },
    { label: "座標の出所" },
    { label: "座標 [km]" },
    { label: "方位" },
  ], rows);
  renderBattleEvents();
}

function renderTrajLegend() {
  const d = traj.data;
  const items = d.slots.map(s =>
    `<span><span class="sw" style="background:${trajColor(s)}"></span>${esc(s)}号</span>`).join("");
  const rings = Object.keys(d.sensor_ranges || {}).map(k =>
    `<span><span class="sw" style="background:${TRAJ_RING_COLORS[k]}"></span>${esc(k)} ${d.sensor_ranges[k]} km</span>`).join("");
  document.getElementById("traj-legend").innerHTML =
    `<span><span class="sw" style="background:#f85149"></span>被弾警報</span>`
    + `<span><span class="sw" style="background:${TRAJ_SENSOR_COLORS.radar}"></span>レーダ ≤80 km</span>`
    + `<span><span class="sw" style="background:${TRAJ_SENSOR_COLORS.irst}"></span>IRST ≤120 km</span>`
    + `<span><span class="sw" style="background:${TRAJ_SENSOR_COLORS.rcs}"></span>護衛対象機（RCS拡大）</span>`
    + `<span><span class="sw" style="background:${TRAJ_SENSOR_COLORS.far}"></span>遠距離 &gt;120 km</span>`
    + `<span><span class="sw" style="background:#ff7b72"></span>誘導弾（発射点→標的・推定）</span>`
    + `<span><span class="sw" style="background:transparent;border:1px solid #8b949e"></span>ロック中（射撃指示）</span>`
    + `<span><span class="sw" style="background:transparent;border:1px dashed #d29922"></span>戦域境界 150 km</span>`
    + `<span><span class="sw" style="background:#3fb950"></span>命中（推定）/探知</span>`
    + `<span><span class="sw" style="background:#8b949e"></span>空振り（推定）</span>`
    + `<span><span class="sw" style="background:#f85149"></span>目標ロスト</span>`
    + items + rings;
}

function renderTrajEvents() {
  const box = document.getElementById("traj-events");
  const events = traj.data.events || [];
  if (!events.length) {
    box.innerHTML = '<div class="empty">イベントなし</div>';
    return;
  }
  box.innerHTML = events.map((e, i) =>
    `<div data-i="${i}" data-t="${e.t}">t=${String(e.t).padStart(4)} ${esc(e.kind)} ${esc(e.text)}</div>`).join("");
  box.querySelectorAll("div[data-t]").forEach(el => {
    el.addEventListener("click", () => {
      traj.t = Number(el.dataset.t);
      document.getElementById("traj-seek").value = traj.t;
      drawTraj();
    });
  });
}

function trajFoeCount(frame) {
  const seen = {};
  (frame.enemy || []).forEach(e => {
    const key = Math.round(e.x) + ":" + Math.round(e.y);
    seen[key] = true;
  });
  return Object.keys(seen).length;
}

function drawTraj() {
  const canvas = document.getElementById("traj-canvas");
  const d = traj.data;
  if (!canvas || !d || !d.frames.length) return;
  if (!canvas.clientWidth) return;
  const cssW = canvas.clientWidth;
  const cssH = Math.max(360, Math.round(cssW * 0.62));
  const dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.height = cssH + "px";
  }
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cssW, cssH);
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, cssW, cssH);

  const frame = d.frames[Math.min(traj.t, d.frames.length - 1)];
  pushFrameToasts(traj, frame);
  const ownAt = (slot, t) => {
    for (let i = t; i >= 0; i--) {
      const p = d.frames[i].own[slot];
      if (p && p.x !== null && p.y !== null) return p;
    }
    return null;
  };
  const own = Object.values(frame.own || {}).filter(p => p.x !== null && p.y !== null);
  let cx = 0, cy = 0;
  if (own.length) {
    cx = own.reduce((a, p) => a + p.x, 0) / own.length;
    cy = own.reduce((a, p) => a + p.y, 0) / own.length;
  }
  const scale = Math.min(cssW, cssH) / traj.span;
  const X = x => cssW / 2 + (x - cx) * scale;
  const Y = y => cssH / 2 - (y - cy) * scale;

  ctx.strokeStyle = "rgba(147,161,176,0.16)";
  ctx.lineWidth = 1;
  ctx.font = "10px Consolas, monospace";
  ctx.fillStyle = "rgba(147,161,176,0.55)";
  const step = traj.span > 200 ? 50 : 25;
  for (let g = -300; g <= 300; g += step) {
    const sx = X(g), sy = Y(g);
    ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, cssH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(cssW, sy); ctx.stroke();
    if (sx > 12 && sx < cssW - 30) ctx.fillText(String(g), sx + 3, cssH - 6);
    if (sy > 12 && sy < cssH - 6) ctx.fillText(String(g), 6, sy - 3);
  }
  ctx.fillStyle = "rgba(147,161,176,0.8)";
  ctx.fillText("x=+ 敵陣側 →", cssW - 96, 14);
  ctx.fillText("← x=- 自陣側", 8, cssH - 20);

  const bounds = d.bounds || { x: 150, y: 150 };
  {
    const bx0 = X(-bounds.x), bx1 = X(bounds.x);
    const by0 = Y(bounds.y), by1 = Y(-bounds.y);
    const left = Math.min(bx0, bx1), top = Math.min(by0, by1);
    ctx.save();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "rgba(210,153,34,0.6)";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(left, top, Math.abs(bx1 - bx0), Math.abs(by1 - by0));
    ctx.restore();
    if (left > -40 && left < cssW - 200 && top > 0 && top < cssH - 12) {
      ctx.fillStyle = "rgba(210,153,34,0.9)";
      ctx.fillText("戦域境界 150 km（越境=PENALTY）", left + 5, top + 13);
    }
  }

  if (traj.rings) {
    Object.entries(d.sensor_ranges || {}).forEach(([k, km]) => {
      ctx.strokeStyle = TRAJ_RING_COLORS[k] || "rgba(147,161,176,0.2)";
      own.forEach(p => {
        ctx.beginPath();
        ctx.arc(X(p.x), Y(p.y), km * scale, 0, Math.PI * 2);
        ctx.stroke();
      });
    });
  }

  if (traj.trail) {
    d.slots.forEach(slot => {
      ctx.strokeStyle = trajColor(slot) + "4d";
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      let started = false;
      for (let i = 0; i <= traj.t && i < d.frames.length; i++) {
        const p = d.frames[i].own[slot];
        if (!p || p.x === null || p.y === null) { started = false; continue; }
        const sx = X(p.x), sy = Y(p.y);
        if (!started) { ctx.moveTo(sx, sy); started = true; } else { ctx.lineTo(sx, sy); }
      }
      ctx.stroke();
    });
  }

  (frame.enemy || []).forEach(e => {
    const sx = X(e.x), sy = Y(e.y);
    ctx.fillStyle = TRAJ_SENSOR_COLORS[e.sensor] || "#e6edf3";
    ctx.beginPath(); ctx.arc(sx, sy, 3.2, 0, Math.PI * 2); ctx.fill();
    if (e.escort) {
      ctx.strokeStyle = "#ffd33d";
      ctx.lineWidth = 1.1;
      ctx.beginPath(); ctx.arc(sx, sy, 5.4, 0, Math.PI * 2); ctx.stroke();
    }
  });

  (frame.threat || []).forEach(th => {
    const src = frame.own[th.slot];
    if (!src || src.x === null) return;
    const rad = (th.bearing || 0) * Math.PI / 180;
    const len = (d.sensor_ranges.mws || 10) * scale;
    const ax = X(src.x), ay = Y(src.y);
    const bx = ax + Math.cos(rad) * len, by = ay - Math.sin(rad) * len;
    ctx.strokeStyle = "#f85149";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.fillStyle = "#f85149";
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI * 2); ctx.fill();
  });

  if (traj.aim) {
    drawAimLayer(ctx, frame, X, Y, slot => ownAt(slot, traj.t));
  }

  Object.entries(frame.own || {}).forEach(([slot, p]) => {
    if (p.x === null || p.y === null) return;
    const sx = X(p.x), sy = Y(p.y), col = trajColor(slot);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(-(p.heading || 0) * Math.PI / 180);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-5, 5); ctx.lineTo(-2, 0); ctx.lineTo(-5, -5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = col;
    ctx.font = "11px Consolas, monospace";
    ctx.fillText(slot + "号", sx + 9, sy - 6);
    if (p.ammo !== undefined && p.ammo !== null) {
      ctx.fillStyle = p.ammo > 0 ? "rgba(147,161,176,0.85)" : "rgba(248,81,73,0.75)";
      ctx.font = "9px Consolas, monospace";
      ctx.fillText(`残弾${num(p.ammo, 0)}`, sx + 9, sy + 10);
    }
  });

  if (traj.shots) {
    drawShotsLayer(ctx, d, frame, X, Y, scale);
  }

  (frame.events || []).forEach(ev => {
    const p = frame.own[ev.slot];
    if (!p || p.x === null) return;
    ctx.strokeStyle = TRAJ_EVENT_COLORS[ev.kind] || "#58a6ff";
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 16, 0, Math.PI * 2); ctx.stroke();
  });

  drawEventToasts(ctx, traj);

  document.getElementById("traj-seek").value = traj.t;
  document.getElementById("traj-time").textContent = `${traj.t + 1} / ${d.frame_count}  （ptime ${frame.ptime}s）`;
  const r = d.result || {};
  const alive = Object.keys(frame.own || {}).length;
  document.getElementById("traj-info").innerHTML = cards([
    { k: "ログ", v: (d.log || "").split("/").slice(-2).join("/") },
    { k: "自機応答", v: alive + " / " + d.slots.length, cls: alive < d.slots.length ? "warn" : "ok" },
    { k: "推定敵位置", v: trajFoeCount(frame) },
    { k: "このフレームのイベント", v: (frame.events || []).length },
    { k: "終了理由", v: r.endReason || "—" },
    { k: "自陣スコア", v: r.own ? num(r.scores ? r.scores[r.own] : null, 3) : "—" },
    { k: "命中率", v: r.hit_rate === null || r.hit_rate === undefined ? "—" : num(r.hit_rate, 3) },
    { k: "生存（自/敵）", v: r.numAlives ? `${r.numAlives.Red ?? "—"} / ${r.numAlives.Blue ?? "—"}` : "—" },
  ]);
  const slotRows = d.slots.map(s => {
    const p = (frame.own || {})[s] || {};
    const aims = (frame.aim || []).filter(a => a.slot === s);
    let nearest = null;
    (frame.enemy || []).forEach(e => {
      if (e.slot !== s) return;
      if (nearest === null || e.dist < nearest) nearest = e.dist;
    });
    const flying = (frame.shots || []).filter(sh => sh.slot === s).length;
    return [
      `<span style="color:${trajColor(s)}">${esc(s)}号</span>`,
      p.ammo === null || p.ammo === undefined ? "—" : num(p.ammo, 0),
      aims.length ? `行${aims[0].row} ${num(aims[0].dist, 1)} km` : "—",
      nearest === null ? "—" : num(nearest, 1),
      flying ? `${flying} 発` : "—",
    ];
  });
  document.getElementById("traj-info").innerHTML += "<h2>機体状況</h2>" + table([
    { label: "機体" },
    { label: "残弾", num: true },
    { label: "射撃指示" },
    { label: "最近敵 km", num: true },
    { label: "飛翔中の弾" },
  ], slotRows);

  const box = document.getElementById("traj-events");
  if (box) {
    box.querySelectorAll("div[data-t]").forEach(el => {
      el.classList.toggle("cur", Number(el.dataset.t) === traj.t);
    });
  }
}

function renderHistoryChart(history) {
  const svg = document.getElementById("hist-chart");
  const legend = document.getElementById("hist-legend");
  if (!svg || !history.length) return;
  const metricBtns = document.querySelectorAll("[data-hist-metric]");
  let metric = "avg_score";
  metricBtns.forEach(b => { if (b.classList.contains("active")) metric = b.dataset.histMetric; });
  metricBtns.forEach(b => {
    b.onclick = () => {
      metricBtns.forEach(x => x.classList.toggle("active", x === b));
      renderHistoryChart(history);
    };
  });

  // one point per history entry, in time order (single series)
  const ACCENT = "#58a6ff";
  const valueOf = (hf) => {
    const m = hf.metrics || {};
    if (metric === "avg_score") return (m.avg_score === null || m.avg_score === undefined) ? null : Number(m.avg_score);
    if (metric === "win_rate") { const g = Number(m.games||0); const w = Number(m.win||0); return g > 0 ? (w/g)*100 : null; }
    if (metric === "avg_our_alive") return (m.avg_our_alive === null || m.avg_our_alive === undefined) ? null : Number(m.avg_our_alive);
    if (metric === "avg_enemy_alive") return (m.avg_enemy_alive === null || m.avg_enemy_alive === undefined) ? null : Number(m.avg_enemy_alive);
    return null;
  };
  const sel = document.getElementById("hist-series");
  const chosen = sel ? sel.value : "__all__";
  const entries = [...history]
    .sort((a,b) => (a.mtime||"").localeCompare(b.mtime||""))
    .filter(hf => chosen === "__all__" || ((hf.metrics || {}).label || hf.name) === chosen);
  const points = entries.map((hf, i) => {
    const m = hf.metrics || {};
    const label = m.label || hf.name || "default";
    return { i, label, v: valueOf(hf), mtime: hf.mtime, name: hf.name, games: m.games, wdl: `${m.win||0}/${m.draw||0}/${m.loss||0}` };
  });
  const valid = points.filter(p => p.v !== null);
  if (sel) sel.onchange = () => renderHistoryChart(history);

  const W = 960, H = 240, M = { l: 40, r: 20, t: 20, b: 40 };
  const w = W - M.l - M.r, h = H - M.t - M.b;
  const vals = valid.map(p => p.v);
  let vmin = vals.length ? Math.min(...vals) : 0;
  let vmax = vals.length ? Math.max(...vals) : 1;
  if (vmax === vmin) { vmax = vmin + 0.01; }
  const pad = (vmax - vmin) * 0.1 || 0.05;
  vmin -= pad; vmax += pad;
  const x = (i) => M.l + (points.length <= 1 ? w/2 : i * (w / (points.length - 1)));
  const y = (v) => M.t + h - ((v - vmin) / (vmax - vmin)) * h;

  let svgStr = `
<defs>
  <style>.axis{stroke:var(--muted);stroke-width:1;opacity:.5}.tick{font-size:10px;fill:var(--muted);font-family:Consolas,monospace}.line{fill:none;stroke-width:2;vector-effect:non-scaling-stroke}.pt{stroke-width:1.5;fill:var(--bg)}</style>
</defs>
<line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${M.t+h}" class="axis"/>
<line x1="${M.l}" y1="${M.t+h}" x2="${M.l+w}" y2="${M.t+h}" class="axis"/>`;

  // ticks y
  const yticks = 4;
  for (let i = 0; i <= yticks; i++) {
    const tv = vmin + (vmax - vmin) * (i / yticks);
    const yy = y(tv);
    svgStr += `<line x1="${M.l-3}" y1="${yy}" x2="${M.l}" y2="${yy}" class="axis"/>`;
    const fmt = (metric === "win_rate") ? Math.round(tv*10)/10 : (tv >= 10 ? Math.round(tv) : Math.round(tv*100)/100);
    svgStr += `<text x="${M.l-6}" y="${yy+3}" text-anchor="end" class="tick">${fmt}</text>`;
  }
  // ticks x (max 6)
  const xt = Math.min(points.length, 6);
  for (let i = 0; i < xt; i++) {
    const idx = Math.floor(i * (points.length - 1) / Math.max(1, xt-1));
    const xx = x(idx);
    const hf = points[idx];
    svgStr += `<line x1="${xx}" y1="${M.t+h}" x2="${xx}" y2="${M.t+h+3}" class="axis"/>`;
    const mtimeStr = hf.mtime || "";
    const t = mtimeStr.includes("T") ? mtimeStr.slice(5,16).replace("T"," ") : mtimeStr.slice(5,16);
    svgStr += `<text x="${xx}" y="${M.t+h+14}" text-anchor="middle" class="tick">${t}</text>`;
  }

  // single trend line through all points in time order
  let trend = "";
  points.forEach(p => {
    if (p.v === null) return;
    const cmd = trend === "" ? "M" : "L";
    trend += cmd + x(p.i) + "," + y(p.v) + " ";
  });
  svgStr += `<path d="${trend.trim()}" class="line" stroke="${ACCENT}"/>`;

  // points (single color)
  points.forEach(p => {
    if (p.v === null) return;
    svgStr += `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="3" class="pt" stroke="${ACCENT}" fill="${ACCENT}"><title>${esc(p.label)} [${esc(p.name)}] ${p.mtime}: ${p.v.toFixed(3)} (${p.wdl}, ${p.games||0}戦)</title></circle>`;
  });

  svg.innerHTML = svgStr;
  if (legend) {
    const labelText = chosen === "__all__" ? "すべて（時系列順）" : chosen;
    const note = valid.length < 2 ? " ※同一系列の履歴が1件のみ（点1つ）" : "";
    legend.innerHTML = `<span class="muted">系列: ${esc(labelText)} / ${valid.length}件${note}</span>`;
  }
}

function showTab(key) {
  TABS.forEach(([k]) => {
    document.getElementById("nav-" + k).classList.toggle("active", k === key);
    document.getElementById("tab-" + k).classList.toggle("active", k === key);
  });
  location.hash = key;
  if (key === "traj") {
    loadTrajEntries(false);
    if (traj.data) drawTraj();
  }
}

function buildNav() {
  TABS.forEach(([k, label]) => {
    const b = document.createElement("button");
    b.id = "nav-" + k; b.textContent = label;
    b.addEventListener("click", () => showTab(k));
    nav.appendChild(b);
  });
}

async function load(force) {
  try {
    try {
      const bres = await fetch("/api/build", { cache: "no-store" });
      const bdata = await bres.json();
      const meta = document.querySelector ? document.querySelector('meta[name="x-build"]') : null;
      const cur = meta ? meta.getAttribute("content") : "";
      if (cur && bdata.build && bdata.build !== cur) {
        try { sessionStorage.setItem("dash-keep-tab", "1"); } catch (e) {}
        location.reload();
        return;
      }
    } catch (e) {}
    const res = await fetch("/api/summary" + (force ? "?force=1" : ""), { cache: "no-store" });
    const data = await res.json();
    state.data = data;
    const stampEl = document.getElementById("stamp");
    const ageMs = Date.parse(String(data.generated_at || "").replace(" ", "T"));
    const stale = !isNaN(ageMs) && (Date.now() - ageMs > 180000);
    stampEl.textContent = "更新 " + data.generated_at + (stale ? "（古い可能性あり・再読み込み推奨）" : "");
    if (stampEl.classList) stampEl.classList.toggle("warn", !!stale);
    // Compute evidence diffs before rendering
    markEvidenceDiffs(data);
    renderEnv(data); renderSub(data); renderEval(data); renderLogs(data);
    renderHypothesis(data); renderSession(data); renderVerify(data); renderGit(data); renderCmd(data); renderRules(data);
  } catch (err) {
    document.getElementById("stamp").textContent = "読み込み失敗: " + err;
  }
}

function markEvidenceDiffs(data) {
  if (!data.session?.evidence) return;
  const prev = JSON.parse(localStorage.getItem("prev_evidence") || "{}");
  const curr = {};
  data.session.evidence.forEach(card => {
    const cardId = card.id || card.title;
    curr[cardId] = card.evidence || [];
    const prevCard = prev[cardId] || [];
    (card.evidence || []).forEach((e, i) => {
      const prevE = prevCard.find(p => p.label === e.label);
      if (!prevE) {
        e._diff = "new";
      } else if (prevE.value !== e.value) {
        e._diff = "changed";
        e._prevValue = prevE.value;
      }
    });
  });
  localStorage.setItem("prev_evidence", JSON.stringify(curr));
}

buildNav();
showTab((location.hash || "#git").slice(1));
window.addEventListener("hashchange", () => showTab((location.hash || "#git").slice(1)));
document.addEventListener("visibilitychange", () => {
  const auto = document.getElementById ? document.getElementById("auto") : null;
  if (!document.hidden && auto && auto.checked) load(true);
});
window.addEventListener("resize", () => { if (traj.data) drawTraj(); });
load(false);
document.getElementById("refresh").addEventListener("click", () => load(true));
document.getElementById("auto").addEventListener("change", () => schedule());
document.getElementById("interval").addEventListener("change", () => schedule());
function schedule() {
  clearInterval(state.timer);
  if (document.getElementById("auto").checked) {
    state.timer = setInterval(() => load(false), Number(document.getElementById("interval").value));
  }
}
schedule();
</script>
