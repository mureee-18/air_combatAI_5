name: Discord PR comment notify

# PR へのコメント・レビューを Discord に流す。詳細は docs/dev/discord-notify.md
on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  notify:
    # issue_comment は PR 上のコメントだけ。ボットの投稿は流さない。
    if: >-
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/discord_pr_notify.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        # コメント本文などはスクリプトが GITHUB_EVENT_PATH の JSON から直接読む（シェルに展開しない）
        run: python3 scripts/discord_pr_notify.py
