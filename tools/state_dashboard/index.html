<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>air_combatAI_5 開発状況ダッシュボード</title>
<style>
  :root {
    --bg: #10151c; --panel: #182029; --line: #26313d; --fg: #e6edf3; --muted: #93a1b0;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; font-size: 14px; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px;
           align-items: center; flex-wrap: wrap; background: #0d1218; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; }
  .meta.warn { color: var(--warn); font-weight: 600; }
  .spacer { flex: 1; }
  button, select { background: #1f2a36; color: var(--fg); border: 1px solid var(--line);
                   border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  nav { display: flex; gap: 4px; padding: 10px 20px 0; flex-wrap: wrap; }
  nav button { border-radius: 6px 6px 0 0; border-bottom-color: transparent; }
  nav button.active { background: var(--panel); border-color: var(--line); border-bottom-color: var(--panel); color: var(--accent); }
  main { padding: 0 20px 40px; }
  section.tab { display: none; background: var(--panel); border: 1px solid var(--line);
                border-top: none; border-radius: 0 0 8px 8px; padding: 16px; }
  section.tab.active { display: block; }
  h2 { font-size: 14px; margin: 20px 0 8px; color: var(--accent); }
  h2:first-child { margin-top: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card { background: #131b23; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; min-width: 150px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 18px; font-variant-numeric: tabular-nums; }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .bad { color: var(--bad); } .muted { color: var(--muted); }
  code, pre { font-family: Consolas, "Courier New", monospace; }
  pre { background: #0b0f14; border: 1px solid var(--line); border-radius: 6px; padding: 10px;
        overflow-x: auto; font-size: 12px; margin: 0; white-space: pre-wrap; }
  .cmd-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 8px 0 4px; }
  .cmd-row .row-label { color: var(--muted); font-size: 12px; margin-right: 2px; }
  .cmd { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .cmd .title { color: var(--muted); min-width: 240px; font-size: 12px; }
  .cmd code { flex: 1; background: #0b0f14; border: 1px solid var(--line); border-radius: 4px; padding: 4px 8px; }
  .cmd button { padding: 2px 8px; font-size: 12px; }
  .bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
  .bar-row .label { width: 140px; color: var(--muted); font-size: 12px; }
  .bar { height: 16px; border-radius: 3px; background: var(--accent); }
  .bar.alt { background: #a371f7; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .rule-card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin-top: 12px; background: #131b23; }
  .rule-card h3 { margin: 0 0 8px; font-size: 14px; color: var(--accent); }
  .rule-groups { display: flex; flex-wrap: wrap; gap: 18px; }
  .rule-group { flex: 1; min-width: 220px; }
  .rule-group-title { font-size: 13px; font-weight: 600; color: var(--fg); margin-bottom: 4px; }
  .rule-items { margin: 0; padding-left: 18px; color: var(--fg); line-height: 1.7; font-size: 13px; }
  .rule-items code { background: #0b0f14; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }
  .traj-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .traj-stage { flex: 1 1 620px; min-width: 380px; }
  .traj-stage canvas { width: 100%; height: auto; display: block; background: #0b0f14;
                       border: 1px solid var(--line); border-radius: 8px; }
  .traj-side { flex: 0 1 330px; min-width: 260px; }
  .traj-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .traj-controls input[type=range] { flex: 1; min-width: 150px; accent-color: var(--accent); }
  .traj-controls label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
  .traj-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .traj-legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; }
  .traj-events { max-height: 300px; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; background: #0b0f14; }
  .traj-events div { padding: 3px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
                     font-family: Consolas, "Courier New", monospace; font-size: 12px; }
  .traj-events div:hover { background: #16202b; }
  .traj-events div.cur { color: var(--accent); background: #16202b; }
  .traj-note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .empty { color: var(--muted); padding: 8px 0; }
  .steps { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 6px; }
  .step { flex: 1 1 190px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: #131b23; }
  .step .n { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center;
             border-radius: 50%; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .step .t { font-size: 13px; font-weight: 600; margin-left: 4px; }
  .step .d { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .step .h { font-size: 12px; color: var(--fg); opacity: .75; margin-top: 3px; line-height: 1.5; }
  .step.done { border-color: #24503a; } .step.done .n { background: var(--ok); color: #0b0f14; border-color: var(--ok); }
  .step.current { border-color: var(--accent); background: #14202c; } .step.current .n { background: var(--accent); color: #0b0f14; border-color: var(--accent); }
  .step.todo .t { color: var(--muted); }
.verify-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 8px 0; background: #131b23; }
.verify-block.current { border-color: var(--accent); background: #14202c; }
.verify-block h3 { margin: 0 0 4px; font-size: 14px; }
.verify-block .badge { margin-left: 6px; }
.verify-block .verify-text { font-size: 13px; line-height: 1.5; margin: 4px 0; }
.verify-pick { display: flex; align-items: center; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
.verify-pick label { color: var(--muted); font-size: 13px; }
.verify-pick select { background: #0e151c; color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 13px; max-width: 560px; }
  .facts { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .fact { flex: 1 1 460px; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: #131b23; }
  .fact.hyp { border-color: #3d5a2e; } .fact.rule { border-color: #3b4a6b; }
  .fact.handled { opacity: .8; background: #10151a; border-color: #2a333b; border-style: dashed; }
  .fact.handled .fact-head .title { color: var(--muted); }
  .fact.parked { opacity: .7; }
  .badge.parked-tag { background: transparent; color: var(--muted); border-color: var(--line); }
  .fact.fresh { border-left: 3px solid var(--accent); }
  .badge.handled-tag { background: #262d34; color: #8b949e; border-color: #3a4249; }
  .fact-group-title { font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  .fact-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .fact-head .title { font-size: 14px; font-weight: 600; color: var(--accent); }
  .badge { font-size: 11px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); }
  .badge.official { border-color: #3b4a6b; color: var(--accent); }
  .badge.deep-pending { border-color: #8b6914; color: #e6b422; }
  .badge.deep-done { border-color: #2d6a3e; color: #56d364; }
  .fact .summary { font-size: 13px; line-height: 1.7; margin: 6px 0; color: var(--fg); }
  .fact-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; margin: 6px 0; }
  .fact-grid .k { color: var(--muted); font-size: 12px; }
  .fact-grid .v { font-size: 13px; font-variant-numeric: tabular-nums; }
  .fact .hyp-box { border-left: 3px solid #3d5a2e; background: #101a14; padding: 6px 10px; margin: 8px 0; font-size: 13px; line-height: 1.7; }
  .fact .hyp-box .k { color: var(--ok); font-size: 12px; }
  .fact .metric { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .fact .metric b { color: var(--fg); font-weight: 600; }
  .fact-grid .v.changed { background: #2d2a1a; border-left: 3px solid var(--warn); padding-left: 6px; }
  .fact-grid .v.new { background: #1a2d1a; border-left: 3px solid var(--ok); padding-left: 6px; }
  .fact-grid .diff-icon { color: var(--warn); font-size: 10px; margin-left: 4px; vertical-align: middle; }
  .fact-grid .diff-icon.new { color: var(--ok); }
  .fact-list { margin: 6px 0; padding: 0; list-style: none; }
  .fact-list li { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .fact-list .title { color: var(--accent); min-width: 130px; }
  .fact-list .text { flex: 1; line-height: 1.6; }
  .fact-list button { padding: 1px 8px; font-size: 11px; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .fact-grid > .extra { display: none; }
  .fact-grid.open > .extra { display: block; }
  .fact-list li.extra { display: none; }
  .fact-list.open li.extra { display: flex; }
  .fact-grid .more-toggle { grid-column: 1 / -1; }
  .more-toggle button { padding: 1px 8px; font-size: 11px; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 6px; cursor: pointer; }
  .more-toggle button:hover { color: var(--fg); border-color: var(--accent); }
  .hypho { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #131b23; }
  .hy-row { display: grid; grid-template-columns: 84px minmax(150px, 260px) 1fr; gap: 8px;
            align-items: center; margin-bottom: 6px; }
  .hy-row label { font-size: 12px; color: var(--muted); }
  .hy-row select, .hy-row input { font-size: 12px; padding: 4px 6px; background: #0b0f14;
            color: var(--fg); border: 1px solid var(--line); border-radius: 4px; width: 100%; }
  .hy-out { margin: 10px 0 6px; border-left: 3px solid var(--accent); padding: 6px 10px; background: #0b0f14; }
  .hy-out .k { font-size: 11px; color: var(--muted); }
  .hy-out .text { font-size: 13px; line-height: 1.7; margin-top: 2px; white-space: pre-wrap; }
  .hy-copy-bar { position: sticky; bottom: 4px; background: #131b23;
                 padding: 6px 4px 4px; border-top: 1px solid var(--line);
                 margin-top: 6px; z-index: 1; }
  button.big { background: var(--accent); color: #0b0f14; border-color: var(--accent);
               font-weight: 600; padding: 6px 16px; width: 100%; }
</style>
</head>
<body>
<header>
  <h1>air_combatAI_5 開発状況</h1>
  <span class="meta" id="stamp">読み込み中…</span>
  <span class="spacer"></span>
  <label class="meta"><input type="checkbox" id="auto"> 自動更新</label>
  <select id="interval">
    <option value="15000">15秒</option>
    <option value="30000">30秒</option>
    <option value="60000">60秒</option>
  </select>
  <button id="refresh">再読み込み</button>
</header>

<nav id="nav"></nav>

<main>
  <section class="tab" id="tab-env"><h2>環境</h2><div id="env"></div></section>
  <section class="tab" id="tab-sub"><h2>提出</h2><div id="sub"></div></section>
  <section class="tab" id="tab-eval"><h2>評価（seed固定ペア評価）</h2><div id="eval"></div></section>
  <section class="tab" id="tab-logs"><h2>ログ</h2><div id="logs"></div></section>
  <section class="tab" id="tab-hyp"><h2>仮説登録</h2><div id="hyp"></div></section>
  <section class="tab" id="tab-session"><h2>改善サイクル</h2><div id="session"></div></section>
  <section class="tab" id="tab-verify"><h2>検証</h2><div id="verify"></div></section>
  <section class="tab" id="tab-git"><h2>git</h2><div id="git">  <div class="cmd-row">
    <button class="copy" data-cmd="status">ステータス表示</button>
    <button class="copy" data-cmd="log -1">最近のコミット</button>
    <button class="copy" data-cmd="branch">ブランチ表示</button>
  </div><div class="cmd-row"><span class="row-label">指示</span>
    <button class="copy" data-cmd="変更をコミットしてプッシュして。事前に git status と git diff を確認し、ステージ対象のファイル一覧とコミットメッセージ案を提示して承認を得ること">コミット＆プッシュ</button>
    <button class="copy" data-cmd="この変更の PR を作成して。タイトルと本文は日本語で書くこと">PR作成</button>
    <button class="copy" data-cmd="PR の CI テスト結果を確認して。失敗していれば原因を報告して">CI確認</button>
    <button class="copy" data-cmd="PR をマージして">マージ</button>
  </div></div></section>
  <section class="tab" id="tab-cmd"><h2>コマンド</h2><div id="cmd"></div></section>
  <section class="tab" id="tab-rules"><h2>コンペルール</h2><div id="rules"></div></section>
  <section class="tab" id="tab-traj"><h2>自機視点リプレイ（自作エージェントのログのみ）</h2><div id="traj"></div></section>
  <section class="tab" id="tab-battle"><h2>戦場俯瞰（両陣営のシミュレーションイメージ）</h2><div id="battle"></div></section>
</main>

<script>
const TABS = [
  ["env", "環境"], ["sub", "提出"], ["eval", "評価"], ["logs", "ログ"],
  ["hyp", "仮説登録"], ["session", "改善サイクル"], ["verify", "検証"], ["git", "git"], ["cmd", "コマンド"], ["rules", "ルール"],
  ["traj", "自機視点"], ["battle", "戦場俯瞰"],
];
const nav = document.getElementById("nav");
const state = { data: null, timer: null, selected: null, verifyHyp: "", hy: {} };

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
// HTML 属性値用のエスケープ（コマンド内の " が属性を壊すため必須）
function attr(s) {
  return esc(s).replace(/"/g, "&quot;");
}
function num(v, digits) {
  if (v === null || v === undefined || v === "") return "—";
  return Number(v).toFixed(digits === undefined ? 2 : digits);
}
function table(headers, rows) {
  if (!rows.length) return '<div class="empty">データがありません</div>';
  let h = "<table><thead><tr>";
  headers.forEach(x => h += `<th>${esc(x.label)}</th>`);
  h += "</tr></thead><tbody>";
  rows.forEach(r => {
    h += "<tr>";
    r.forEach((c, i) => {
      const cls = headers[i].num ? ' class="num"' : "";
      h += `<td${cls}>${c}</td>`;
    });
    h += "</tr>";
  });
  return h + "</tbody></table>";
}
function cards(items) {
  return '<div class="cards">' + items.map(i =>
    `<div class="card"><div class="k">${esc(i.k)}</div><div class="v ${i.cls || ""}">${esc(i.v)}</div></div>`
  ).join("") + "</div>";
}
function copy(text, btn) {
  const flash = (label, ms) => {
    const old = btn.textContent;
    btn.textContent = label;
    setTimeout(() => { btn.textContent = old; }, ms);
  };
  const ok = () => flash("コピー済", 1200);
  const ng = () => flash("コピー失敗", 2000);
  const legacy = () => {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      const done = document.execCommand("copy");
      document.body.removeChild(ta);
      if (done) ok(); else ng();
    } catch (e) {
      ng();
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(ok).catch(legacy);
  } else {
    legacy();
  }
}

function renderEnv(d) {
  const e = d.environment;
  const drift = e.deploy_drift;
  const driftCls = drift === null ? "" : (drift.args_match && drift.config_match ? "ok" : "warn");
  const driftTxt = drift === null ? "未配置"
    : ((drift.args_match && drift.config_match) ? "一致" : ",要再ビルド");
  let h = cards([
    { k: "specialist (repo)", v: e.repo_specialist },
    { k: "workspace", v: e.workspace.exists ? e.workspace.size_h : "無し", cls: e.workspace.exists ? "" : "bad" },
    { k: "シミュレータ", v: e.workspace.simulator_ready ? "配置済み" : "未配置", cls: e.workspace.simulator_ready ? "ok" : "bad" },
    { k: "配置ドリフト", v: driftTxt, cls: driftCls },
    { k: "ホスト", v: e.host.python },
  ]);
  h += "<h2>Docker コンテナ</h2>";
  if (!e.docker.available) h += '<div class="empty">docker コマンドを実行できません（Docker Desktop が起動中か確認）</div>';
  else if (!e.docker.containers.length) h += '<div class="empty">起動中のコンテナはありません</div>';
  else h += table([{label:"コンテナ"},{label:"ステータス"},{label:"イメージ"}],
    e.docker.containers.map(c => [esc(c.name), esc(c.status), esc(c.image)]));
  h += "<h2>配置（workspace/Agents）</h2>";
  h += table([{label:"Agent ディレクトリ"},{label:"備考"}],
    (e.workspace.agents.length ? e.workspace.agents : ["—"]).map(a =>
      [esc(a), a === "MyAgent" ? "ビルドした提出物" : (a === "BenchMark" ? "公式ベンチマーク" : "")]));
  h += "<h2>ホスト情報</h2>";
  h += table([{label:"項目"},{label:"値"}], [
    ["OS", esc(e.host.platform)],
    ["Python (ホスト)", esc(e.host.python)],
    ["numpy (ホスト)", e.host.numpy ? "導入済み" : "未導入（コンテナ内で実行するツール.matrix)"],
  ]);
  document.getElementById("env").innerHTML = h;
}

function renderSub(d) {
  const s = d.submission;
  let h = cards([
    { k: "specialist", v: s.specialist, cls: s.specialist_allowed ? "ok" : "bad" },
    { k: "提出可能", v: s.specialist_allowed ? "YES" : "NO", cls: s.specialist_allowed ? "ok" : "bad" },
    { k: "submit.zip", v: s.zip.exists ? s.zip.size_h : "未ビルド", cls: s.zip.exists ? "ok" : "warn" },
    { k: "ゲート", v: s.gate_ok ? "OK" : "BLOCK", cls: s.gate_ok ? "ok" : "warn" },
  ]);
  const argsJson = JSON.stringify(s.args, null, 2);
  const gateText = s.gate_output.join("\n");
  h += "<h2>args.json</h2>";
  h += `<div class="cmd"><span class="title">args.json をコピー</span>` +
    `<span class="muted" style="flex:1">下の JSON 項と同一</span>` +
    `<button data-cmd="${attr(argsJson)}">コピー</button></div>`;
  h += "<pre>" + esc(argsJson) + "</pre>";
  h += "<h2>提出コマンド</h2>";
  const subGroup = (d.commands || []).find(g => g.group === "提出");
  (subGroup ? subGroup.items : []).forEach(it => { h += cmdRow(it.cmd, it.title); });
  h += "<h2>提出物のルートファイル</h2>";
  h += table([{label:"ファイル"},{label:"有無"}],
    Object.keys(s.zip_entries).map(k => [esc(k), s.zip_entries[k] ? '<span class="ok">あり</span>' : '<span class="bad">なし</span>']));
  h += "<h2>提出前ゲート（tools/hooks/pre_submit_gate.py）</h2>";
  h += "<p class=\"meta\">ゲートは <code>" + esc(s.confirm_env) + "=1</code> なしの実行を BLOCK 扱いします（意図した設計）。</p>";
  h += `<div class="cmd"><span class="title">ゲート出力をコピー</span>` +
    `<span class="muted" style="flex:1">下の出力欄と同一</span>` +
    `<button data-cmd="${attr(gateText)}">コピー</button></div>`;
  h += "<pre>" + esc(gateText) + "</pre>";
  if (s.zip.exists) h += `<p class="meta">ビルド日時: ${esc(s.zip.mtime)} / サイズ: ${esc(s.zip.size_h)}</p>`;
  document.getElementById("sub").innerHTML = h;
  bindCopy(document.getElementById("sub"));
}

function renderEval(d) {
  const p = d.paired;
  if (!p.files.length) {
    document.getElementById("eval").innerHTML =
      '<div class="empty">workspace/paired/*.json がありません。<br>docker exec atla5-cpu bash -lc "cd /workspace && python /repo/local_test/run_eval_paired.py --seeds 1,2,3 --colors both --label baseline --out /workspace/paired/baseline.json"</div>';
    return;
  }
  const bestScore = Math.max(1, ...p.files.map(f => (f.metrics || {}).avg_score || 0));
  const pickLabel = lbl => p.files.find(f => (f.metrics || {}).label === lbl) || null;
  const focusNames = [];
  [(pickLabel("default") || {}).name, p.best, (pickLabel("baseline") || {}).name]
    .forEach(n => { if (n && !focusNames.includes(n)) focusNames.push(n); });
  const focus = focusNames.map(n => p.files.find(f => f.name === n)).filter(Boolean);
  const roleTags = f => {
    const m = f.metrics || {};
    const t = [];
    if (f.name === p.best) t.push("★最良");
    if (m.label === "default") t.push("現行");
    if (m.label === "baseline") t.push("基準");
    return t.join(" / ");
  };
  const scoreCell = f => {
    const m = f.metrics || {};
    const w = Math.round(((m.avg_score || 0) / bestScore) * 140);
    return `<span style="display:inline-flex;align-items:center;gap:6px">` +
      `<span class="bar ${f.name === p.best ? "" : "alt"}" style="width:${w}px;height:12px"></span>` +
      `<span>${num(m.avg_score, 3)}</span></span>`;
  };
  const evalHeaders = [
    {label:"label / 役割", num:false}, {label:"ファイル", num:false}, {label:"対戦数", num:true},
    {label:"win/draw/loss", num:false}, {label:"avg_score", num:false},
    {label:"avg_our_alive", num:true}, {label:"avg_enemy_alive", num:true}, {label:"更新", num:false},
  ];
  const evalRow = f => {
    const m = f.metrics || {};
    const role = roleTags(f);
    return [
      esc((m.label || f.name) + (role ? ` (${role})` : "")), esc(f.name),
      m.games ?? "—", `${m.win ?? "—"}/${m.draw ?? "—"}/${m.loss ?? "—"}`,
      scoreCell(f), num(m.avg_our_alive, 2), num(m.avg_enemy_alive, 2), esc(f.mtime),
    ];
  };
  const gm = (d.custom_metrics && d.custom_metrics.rows) || [];
  const goalTotal = gm.filter(m => m.target !== null && m.target !== undefined).length;
  const goalDone = gm.filter(m => m.status === "reached").length;
  let h = cards([
    { k: "評価ファイル", v: p.files.length },
    { k: "最良", v: p.best || "—" },
    { k: "目標", v: goalTotal ? `${goalDone}/${goalTotal} 達成` : "—",
      cls: goalTotal && goalDone === goalTotal ? "ok" : "" },
  ]);
  h += "<h2>注目（現行 default／★最良／基準 baseline）</h2>";
  h += table(evalHeaders, focus.map(evalRow));

  if (p.history && p.history.length) {
    h += "<h2>強化推移（時系列・古い順）</h2>";
    h += '<div class="section" style="margin-top:8px">';
    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px">';
    h += '<span class="muted">指標：</span>';
    h += '<button class="btn small active" data-hist-metric="avg_score">avg_score</button>';
    h += '<button class="btn small" data-hist-metric="win_rate">勝率(%)</button>';
    h += '<button class="btn small" data-hist-metric="avg_our_alive">avg_our_alive</button>';
    h += '<button class="btn small" data-hist-metric="avg_enemy_alive">avg_enemy_alive</button>';
    const histLabels = [...new Set(p.history.map(hf => (hf.metrics || {}).label || hf.name))];
    h += '<span class="muted" style="margin-left:8px">系列：</span>';
    h += '<select id="hist-series" class="btn small">';
    h += '<option value="__all__">すべて（時系列順）</option>';
    h += histLabels.map(l => `<option value="${attr(l)}">${esc(l)}</option>`).join("");
    h += '</select>';
    h += '</div>';
    h += '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:6px;padding:8px;background:var(--bg-soft)">';
    h += '<svg id="hist-chart" width="960" height="240" viewBox="0 0 960 240" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;max-height:320px"></svg>';
    h += '</div>';
    h += '<div id="hist-legend" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"></div>';
    h += '</div>';
    // 時系列の全件表は「過去の実験」に集約（重複表示を避ける）
    // defer chart render
    setTimeout(() => renderHistoryChart(p.history), 0);
  }

  const rest = p.files.filter(f => !focusNames.includes(f.name));
  h += `<details style="margin-top:10px">` +
    `<summary style="cursor:pointer;color:var(--muted);font-size:13px">過去の実験 ${rest.length} 件（クリックで展開）</summary>`;
  h += table(evalHeaders, rest.map(evalRow));
  h += "</details>";

  h += "<h2>目標（独自指標）</h2>";
  h += renderGoals(d);
  document.getElementById("eval").innerHTML = h;
  bindCopy(document.getElementById("eval"));
}

function goalPct(m) {
  const v = m.value, t = m.target;
  if (v === null || v === undefined || t === null || t === undefined || t === 0) return null;
  if (m.direction === "lower") {
    if (v <= t) return 100;
    return Math.max(0, Math.min(100, Math.round((t / v) * 100)));
  }
  return Math.max(0, Math.min(100, Math.round((v / t) * 100)));
}

function goalStatus(m) {
  if (m.status === "reached") return '<span class="ok">達成</span>';
  if (m.status === "open") return '<span class="warn">未達</span>';
  if (m.target === null || m.target === undefined) return '<span class="muted">参考</span>';
  return '<span class="muted">値なし</span>';
}

// 目標ボード: custom_metrics.json の定義と値・目標・進捗を評価タブに出す（読み取り専用）
function renderGoals(d) {
  const cm = d.custom_metrics || {};
  const rows = cm.rows || [];
  if (!rows.length) {
    return '<div class="empty">独自指標が未定義です。</div>' +
      cmdRow(cm.add_command || "python tools/state_dashboard/add_metric.py --list", "定義を追加する");
  }
  const fmt = (v, digits) =>
    v === null || v === undefined ? "—" : num(v, digits === undefined ? 2 : digits);
  let h = table(
    [{label:"状態"}, {label:"指標"}, {label:"現在値", num:true},
     {label:"目標", num:true}, {label:"進捗"}, {label:"出所"}],
    rows.map(m => {
      const pct = goalPct(m);
      const bar = pct === null
        ? '<span class="muted">—</span>'
        : `<span style="display:inline-flex;align-items:center;gap:6px">` +
          `<span class="bar ${pct >= 100 ? "" : "alt"}" style="width:${Math.round(pct * 1.2)}px;height:10px"></span>` +
          `<span class="muted">${pct}%</span></span>`;
      const target = m.target === null || m.target === undefined
        ? "—"
        : `${fmt(m.target, m.digits)}${m.direction === "lower" ? " 以下" : " 以上"}`;
      const labelCell =
        `<b>${esc(m.label)}</b><br><span class="muted" style="font-size:11px">${esc(m.id)}</span>` +
        (m.note ? `<br><span class="muted" style="font-size:11px">${esc(m.note)}</span>` : "");
      return [
        goalStatus(m), labelCell,
        `${fmt(m.value, m.digits)}${m.unit ? ` <span class="muted">${esc(m.unit)}</span>` : ""}`,
        target, bar, `<span class="pill" title="${attr(m.where || "")}">${esc(m.tab || "—")}</span>`,
      ];
    })
  );
  h += `<p class="meta">${esc(cm.note || "定義は tools/state_dashboard/custom_metrics.json。")}</p>`;
  h += "<h2>目標の編集</h2>";
  h += cmdRow(cm.add_command || "python tools/state_dashboard/add_metric.py --label \"<指標名>\" --from paired --direction higher --target <目標値>", "指標を追加する");
  h += cmdRow(cm.list_command || "python tools/state_dashboard/add_metric.py --list", "定義一覧を表示");
  h += '<details style="margin-top:4px"><summary style="cursor:pointer;color:var(--muted);font-size:13px">指標ごとの目標を変更</summary>';
  rows.forEach(m => {
    h += cmdRow(
      `python tools/state_dashboard/add_metric.py --id ${m.id} --target <新しい目標値>`,
      `「${m.label}」の目標を更新`);
  });
  h += "</details>";
  return h;
}

function renderLogs(d) {
  const l = d.logs;
  let h = cards([
    { k: "世代数", v: l.generations.length },
    { k: "合計サイズ", v: l.total_size_h },
  ]);
  h += "<h2>ログ世代（workspace/results*）</h2>";
  h += table([{label:"世代"},{label:"ログ数",num:true},{label:"サイズ",num:true},{label:"更新",num:false},{label:"最新ログ",num:false}],
    l.generations.map(g => [esc(g.name), g.logs, esc(g.size_h), esc(g.mtime), esc(g.newest || "—")]));
  const s = l.newest_stats;
  h += "<h2>最新ログの挙動指標</h2>";
  if (!s) h += '<div class="empty">解析できるログがありません</div>';
  else if (s.error) h += `<pre>${esc(s.error)}</pre>`;
  else {
    h += `<p class="meta">${esc(s.log)} / ${s.steps} ステップ / <span class="pill">${esc(s.mode)}</span></p>`;
    h += table([{label:"機体"},{label:"敵探知",num:true},{label:"被弾警報",num:true},{label:"射撃指示",num:true},
                {label:"護衛対象機",num:true},{label:"最近接[km]",num:true},{label:"最小残弾",num:true}],
      s.agents.map(a => [esc(a.agent), a.enemy_seen, a.threat, a.fire_orders, a.escorted_seen,
        a.min_dist_km === null ? "—" : num(a.min_dist_km, 1), a.min_rmsls === null ? "—" : a.min_rmsls]));
    if (s.mode !== "自作エージェント") {
      h += '<p class="meta">baseline / BenchMark のログは observation がスカラー構造のため指標は 0 になります。自作エージェントのログを選ぶと値が出ます。</p>';
    }
  }
  document.getElementById("logs").innerHTML = h;
}

const STEP_STATE_LABEL = { done: "済", current: "次", todo: "未" };

// 登録系コピーは、貼った時点でAIが意図を判別できるよう先頭に種別行を付ける
const INTENT_FACT = "# 事実確認（仮説登録なし）— 実行して結果のみ報告\n";
const INTENT_MATERIAL = "# 仮説の材料 — この事実を前提に仮説を1本立ててください\n";
const INTENT_ASSUMPTION = "# 前提登録 — この行をAIに貼って登録依頼\n";
const INTENT_HYPOTHESIS = "# 仮説登録 — この行をAIに貼って登録依頼\n";
const INTENT_REVIEW = "# 文書レビュー — この指摘の修正をお願いします\n";
const INTENT_REOPEN = "# 見直し依頼 — この材料は対応不要とされているが、見直しを求めます。理由も書いてください\n";
const INTENT_IMPL = "# 実装依頼 — この行をAIに貼って1変数の実装を依頼（実装→build_submission --deploy→③ゲート→④ペア評価→⑤validate）\n";

function withIntent(intent, cmd) {
  return cmd ? intent + cmd : cmd;
}

function cmdRow(cmd, label, intent) {
  if (!cmd) return "";
  const copied = intent ? intent + cmd : cmd;
  return `<div class="cmd"><span class="title">${esc(label || "コマンド")}</span>` +
         `<code>${esc(cmd)}</code><button data-cmd="${attr(copied)}">コピー</button></div>`;
}

function bindCopy(root) {
  root.querySelectorAll("button[data-cmd]").forEach(btn => {
    btn.addEventListener("click", () => copy(btn.dataset.cmd, btn));
  });
}

// 処理済み＝記録連動のみ。コピーしただけでは付けない。
function recordedPhrases() { try { const r = (typeof state !== "undefined" && state.data && state.data.session && state.data.session.recorded_materials) || []; return Array.isArray(r) ? r : []; } catch (e) { return []; } }
function isHandled(c) {
  const phrase = c.phrase || "";
  if (!phrase) return false;
  for (const r of recordedPhrases()) {
    if (r.phrase === phrase) return true;
  }
  return false;
}
function sortByHandled(list) { const un = [], hd = []; list.forEach(c => { (isHandled(c) ? hd : un).push(c); }); return un.concat(hd); }

function bindFactToggle(root) {
  root.querySelectorAll("button[data-fact-toggle]").forEach(btn => {
    btn.addEventListener("click", () => {
      const box = btn.closest(".fact-grid, .fact-list");
      if (!box) return;
      const open = box.classList.toggle("open");
      btn.textContent = open ? btn.dataset.less : btn.dataset.more;
    });
  });
}

function renderSteps(steps) {
  if (!steps || !steps.length) return '<div class="empty">対象 specialist が未設定です。</div>';
  let h = '<div class="steps">';
  steps.forEach((s, i) => {
    h += `<div class="step ${s.state}">` +
         `<span class="n">${STEP_STATE_LABEL[s.state] || "?"}</span>` +
         `<span class="t">${i + 1}. ${esc(s.label)}</span>` +
         `<div class="d">${esc(s.detail || "")}</div>` +
         `<div class="h">${esc(s.hint || "")}</div>`;
    h += "</div>";
  });
  return h + "</div>";
}

const PARKED_PATTERNS = ["新規仮説はない", "変数はない", "閉鎖", "棄却済み"];
function isParked(c) {
  const t = c.hypothesis || "";
  return PARKED_PATTERNS.some(p => t.indexOf(p) >= 0);
}

function renderFactGroups(list) {
  const un = [], pk = [], hd = [];
  list.forEach(c => {
    if (isHandled(c)) hd.push(c);
    else if (isParked(c)) pk.push(c);
    else un.push(c);
  });
  const anySub = pk.length + hd.length > 0;
  let h = "";
  if (un.length && (pk.length || hd.length)) h += `<div class="fact-group-title">未処理（${un.length}件）</div>`;
  h += un.map(c => renderFact(c, (pk.length || hd.length) ? "fresh" : "")).join("");
  if (pk.length) {
    h += `<div class="fact-group-title">見送り（対応不要・${pk.length}件）</div>`;
    h += pk.map(c => renderFact(c, "parked")).join("");
  }
  if (hd.length) {
    h += `<div class="fact-group-title">処理済み（${hd.length}件）</div>`;
    h += hd.map(c => renderFact(c, "handled")).join("");
  }
  return h;
}
function renderFact(card, extraCls) {
  const badgeKind = { observation: "観測", assumption: "前提", rule: "公式ルール" };
  const badgeSrc = { log: "ログ", code: "コード", official: "公式" };
  const handledTag = "";
  const deepened = !!card.deepened;
  const needDeepen = !!(card.phrase && !deepened && card.kind !== "assumption" && card.kind !== "rule");
  let h = `<div class="fact ${card.kind}">`;
  h += '<div class="fact-head">' +
       `<span class="title">${esc(card.title)}</span>` +
       `<span class="badge">${esc(badgeKind[card.kind] || card.kind)}</span>` +
       `<span class="badge${card.source === "official" ? " official" : ""}">` +
       `${esc(badgeSrc[card.source] || card.source)}</span>` +
       (needDeepen ? '<span class="badge deep-pending">深掘り未了</span>' : '') +
       (deepened ? '<span class="badge deep-done">深掘り済</span>' : '') +
       `${handledTag}</div>`;
  if (card.summary) h += `<div class="summary clamp2">${esc(card.summary)}</div>`;

  if (card.evidence && card.evidence.length) {
    const LIMIT = 8;
    const hasExtra = card.evidence.length > LIMIT;
    h += '<div class="fact-grid">';
    card.evidence.forEach((e, idx) => {
      const digits = e.digits !== undefined ? e.digits : (Number.isInteger(e.value) ? 0 : 2);
      const v = e.num ? num(e.value, digits) : esc(e.value);
      const diffClass = e._diff === "changed" ? "changed" : (e._diff === "new" ? "new" : "");
      const diffIcon = e._diff === "changed" ? '<span class="diff-icon">🔄</span>' : (e._diff === "new" ? '<span class="diff-icon new">NEW</span>' : "");
      const prevDisplay = e._diff === "changed" && e._prevValue !== undefined ? ` <span class="k" style="opacity:0.6">(前: ${esc(String(e._prevValue))})</span>` : "";
      const cls = hasExtra && idx >= LIMIT ? ' class="extra"' : "";
      h += `<div${cls}><div class="k">${esc(e.label)}</div><div class="v ${diffClass}">${v}${diffIcon}${prevDisplay}</div></div>`;
    });
    if (hasExtra) {
      const n = card.evidence.length - LIMIT;
      h += `<div class="more-toggle"><button data-fact-toggle data-more="+${n}件を表示" data-less="折りたたむ">+${n}件を表示</button></div>`;
    }
    h += "</div>";
  }

  if (card.items && card.items.length) {
    const LIMIT = 3;
    const hasExtra = card.items.length > LIMIT;
    h += '<ul class="fact-list">';
    card.items.forEach((it, idx) => {
      const title = it.title ? `<span class="title">${esc(it.title)}</span>` : "";
      const cls = hasExtra && idx >= LIMIT ? ' class="extra"' : "";
      h += `<li${cls}>${title}<span class="text">${esc(it.text)}</span>` +
           `<button data-cmd="${attr(withIntent(INTENT_ASSUMPTION, it.command))}">コピー</button></li>`;
    });
    if (hasExtra) {
      const n = card.items.length - LIMIT;
      h += `<li class="more-toggle"><button data-fact-toggle data-more="+${n}件を表示" data-less="折りたたむ">+${n}件を表示</button></li>`;
    }
    h += "</ul>";
  }

  if (card.hypothesis) {
    h += '<div class="hyp-box"><div class="k">ここから立てられる仮説例</div>' +
         `<div class="clamp2">${esc(card.hypothesis)}</div></div>`;
  }
  // 見送り（parked）カードの場合、「新しい分析に入る指示」をコピーするボタンを表示
  const isParkedCard = card.hypothesis && ["新規仮説はない", "変数はない", "閉鎖", "棄却済み"].some(p => (card.hypothesis || "").indexOf(p) >= 0);
  if (isParkedCard) {
    const unparkCmd = `見送りカード「${card.title}」を復活。新しい視点で再分析して：(1) 棄却結果・経過を反映した事実の更新、(2) 軌跡・ログの再検証、(3) 未試験の軸または設計変更の仮説立案。--specialist ${state.data?.session?.target || "default"}`;
    h += `<button class="copy unpark" data-cmd="${attr(unparkCmd)}">新しい分析に入る</button>`;
  }
  // 深掘り未了カードには専用の「深掘りする」ボタンを表示
  if (needDeepen) {
    const deepenCmd = `この事実カード「${card.title}」は深掘り未了。まず trajectory / battle_stats で射撃・接近・回避の分布を分析し、python analysis/tools/improvement_session.py deepen "" "<分析で分かったこと>" --card-id "${card.id}" --specialist ${state.data?.session?.target || "default"} で深掘りを記録する。`;
    h += `<button class="copy deepen" data-cmd="${attr(deepenCmd)}">深掘りする</button>`;
  }
  // 事実カードの仮説用フィールド（card_fill.json 由来）を表示する。未記入の枠は出さない
  if (card.cause) {
    const st = card.variable_status || "none";
    const stLabel = {open: "未試験の数値ノブ", direction: "方向カード（構造変更）", closed: "検証済みの軸（再試験禁止）", none: "仮説対象外"}[st] || st;
    h += `<div class="hyp-box"><div class="k">原因・変数（${esc(stLabel)}）</div>` +
         `<div class="clamp2">原因: ${esc(card.cause)}</div>` +
         (card.variable ? `<div class="clamp2">変数: ${esc(card.variable)}</div>` : "") +
         (card.reason ? `<div class="clamp2">理由: ${esc(card.reason)}</div>` : "") +
         `</div>`;
  }
  // 仮説登録ボタン: 深掘り未了なら深掘りを先に促す。雛形（<原因> 等）は出さず、カードの値だけで組む
  if (card.phrase) {
    const target = state.data?.session?.target || "default";
    const fillable = (card.variable_status === "open" || card.variable_status === "direction") && card.prediction;
    let hypothesisCmd = null;
    if (needDeepen) {
      hypothesisCmd = `この事実カード「${card.title}」は深掘り未了。まず trajectory / battle_stats で射撃・接近・回避の分布を分析し、python analysis/tools/improvement_session.py deepen "" "<分析で分かったこと>" --card-id "${card.id}" --specialist ${target} で深掘りを記録してから、仮説を立てる。`;
    } else if (fillable) {
      const text = `${card.phrase} の結果、原因: ${card.cause}。変数: ${card.variable}。判定指標: ${card.judge}。予測: ${card.prediction}`;
      const vname = card.variable_name || "<変数名>";
      hypothesisCmd = `python analysis/tools/improvement_session.py hypothesis "${text}" --specialist ${target} --variable ${vname} --source ${card.source || "log"}`;
    }
    if (hypothesisCmd) {
      h += `<button class="copy hypothesis" data-cmd="${attr(hypothesisCmd)}">仮説登録</button>`;
    }
  }
  if (card.metric) h += `<div class="metric">判定指標: <b>${esc(card.metric)}</b></div>`;
  h += cmdRow(card.command, card.command_label, INTENT_FACT);
  // コマンドも登録itemも持たない事実カード（独自指標・条件トリガー・スコア）は
  // 値そのものを「仮説の材料」としてコピーできるようにする（確認作業は発生しない）
  if (!card.command && !(card.items && card.items.length) && card.phrase) {
    // new fact card (no command, no items, has phrase) always shows MATERIAL button,
    // regardless of extraCls (handled/parked). this ensures unprocessed cards
    // always present as "hypothesis material" for hypothesis building.
    const intent = card.copyIntent === "review" ? INTENT_REVIEW : INTENT_MATERIAL;
    const label = card.copyLabel || "仮説の材料";
    h += `<button class="copy material" data-cmd="${attr(withIntent(intent, card.phrase))}">${esc(label)}</button>`;
  }
  return h + "</div>";
}

// 再描画の前にビルダーの入力値を保存する（自動更新で消えないように）
function syncHypothesis() {
  const box = document.querySelector(".hypho");
  if (!box) return;
  box.querySelectorAll("[data-hy]").forEach(el => {
    state.hy[el.getAttribute("data-hy")] = el.value;
  });
}

function restoreHypothesis() {
  const box = document.querySelector(".hypho");
  if (!box) return;
  box.querySelectorAll("[data-hy]").forEach(el => {
    const v = state.hy[el.getAttribute("data-hy")];
    if (v !== undefined && v !== null) el.value = v;
  });
}

// 事実・原因・変数・指標を選ぶだけで仮説の文と登録コマンドを組み立てる（読み取り専用）
function renderHypothesisBuilder(s, d) {
  const cm = (d.custom_metrics && d.custom_metrics.rows) || [];
  const facts = (s.evidence || []).filter(c => c.phrase && c.id !== "paired");
  const causes = [];
  (s.evidence || []).forEach(c => {
    if (c.id === "constraints" && c.items) {
      c.items.forEach(it => causes.push({ label: it.title, phrase: it.phrase || it.text }));
    }
  });
  const opt = (v, t) => `<option value="${attr(v)}">${esc(t)}</option>`;
  let h = '<p class="meta">選ぶだけで仮説の文と登録コマンドができる（読み取り専用・登録はコピーのみ）。' +
          '数値が無い欄は <code>&lt;…&gt;</code> のままなので Terminal で書き換える。</p>';
  h += '<div class="hypho">';
  h += '<div class="hy-row"><label>事実</label><select data-hy="fact">' +
       opt("", "（事実カードから選ぶ）") +
       facts.map(c => opt(c.id, c.title)).join("") + "</select>" +
       '<input data-hy="fact-text" placeholder="選択すると入る。手で書き直してよい"></div>';
  h += '<div class="hy-row"><label>原因</label><select data-hy="cause">' +
       opt("", "（制約から選ぶ）") +
       causes.map((c, i) => opt(String(i), c.label)).join("") + "</select>" +
       '<input data-hy="cause-text" placeholder="選択すると入る。1変数だけ書く"></div>';
  h += '<div class="hy-row"><label>変数</label>' +
       '<input data-hy="change" placeholder="1変数だけ書く（例: maxSimulShot の上限を 4 → 6）"></div>';
  h += '<div class="hy-row"><label>変数名</label>' +
       '<input data-hy="variable" placeholder="コード上の名前（例: maxSimulShot）。重複防止に使う">' +
       '<span class="meta">事実カードを選ぶと自動で入る</span></div>';
  h += '<div class="hy-row"><label>挙動指標</label><select data-hy="metric">' +
       opt("", "（選ぶ）") +
       cm.map(m => opt(m.id, `${m.label}（${m.value === null ? "値なし" : m.value} → ${m.target === null ? "目標なし" : m.target}）`)).join("") +
       "</select>" +
       '<input data-hy="metric-text" placeholder="何から何に変わるか（例: 8 発 → 20 発以上）"></div>';
  h += '<div class="hy-row"><label>判定指標</label><select data-hy="judge">' +
       opt("", "（選ぶ）") +
       ((d.paired && d.paired.files) || []).map(f => {
         const m = f.metrics || {};
         return opt("paired:" + f.name,
           `${f.name}: avg_score ${m.avg_score} / 自機生存 ${m.avg_our_alive} / 敵生存 ${m.avg_enemy_alive}`);
       }).join("") +
       "</select>" +
       '<input data-hy="judge-text" placeholder="目標値（例: avg_score 0.5 超え / 敵生存 3.0 以下）"></div>';
  h += '<div class="hy-row"><label>--source</label><select data-hy="source">' +
       ["log", "analysis", "code", "official"].map(v => opt(v, v)).join("") +
       "</select>" +
       '<span class="meta">事実カードを選ぶと自動で入る</span></div>';
  h += '<div class="hy-out"><div class="k">組み立てた仮説</div>' +
       '<div id="hypho-text" class="text">—</div></div>';
  h += '<div class="hy-copy-bar"><button id="hypho-copy" class="big" data-cmd="">' +
       "この内容で仮説を登録する（コピー）</button></div>";
  h += "</div>";
  return h;
}

function bindHypothesisBuilder(root, s, d) {
  if (!root || typeof root.querySelector !== "function") return;
  const box = root.querySelector(".hypho");
  if (!box) return;
  const q = name => box.querySelector(`[data-hy="${name}"]`);
  const facts = (s.evidence || []).filter(c => c.phrase && c.id !== "paired");
  const causes = [];
  (s.evidence || []).forEach(c => {
    if (c.id === "constraints" && c.items) {
      c.items.forEach(it => causes.push({ label: it.title, phrase: it.phrase || it.text }));
    }
  });
  const cm = (d.custom_metrics && d.custom_metrics.rows) || [];
  const pairedFiles = (d.paired && d.paired.files) || [];
  const base = 'python analysis/tools/improvement_session.py hypothesis "';
  const fmt = (v, digits) => (v === null || v === undefined ? null : num(v, digits === undefined ? 2 : digits));
  function metricText() {
    const row = cm.find(m => m.id === q("metric").value);
    if (!row) return "";
    const now = fmt(row.value, row.digits);
    const goal = fmt(row.target, row.digits);
    const unit = row.unit || "";
    const higher = row.direction !== "lower";
    if (goal === null) return higher ? `${row.label} を増やす` : `${row.label} を減らす`;
    const head = higher
      ? `${row.label} を ${goal}${unit} 以上に増やす`
      : `${row.label} を ${goal}${unit} 以下に減らす`;
    return now === null ? head : `${head}（現在 ${now}${unit}）`;
  }
  function judgeText() {
    const v = q("judge").value;
    if (!v) return "";
    const name = v.replace("paired:", "").replace(".json", "");
    const f = pairedFiles.find(x => String(x.name).replace(".json", "") === name);
    const m = (f && f.metrics) || {};
    return `判定は ${name} の avg_score ${m.avg_score ?? "<…>"}（0.5 超えが必要）と敵生存 ${m.avg_enemy_alive ?? "<…>"} で見る`;
  }
  function rebuild() {
    const card = facts.find(c => c.id === q("fact").value);
    const fact = q("fact-text").value || (card ? card.phrase : "");
    const ctext = q("cause-text").value;
    const change = q("change").value;
    const mtext = q("metric-text").value || metricText();
    const jtext = q("judge-text").value || judgeText();
    const parts = [];
    parts.push(fact ? `${fact} の結果` : "<事実>");
    if (ctext) parts.push(`${ctext} ため`);
    if (change) parts.push(`${change} とすると`);
    parts.push(mtext || "<挙動指標の予測>");
    parts.push(jtext ? `${jtext} と予測する。` : "<判定指標の目標> と予測する。");
    const text = parts.join("、").replace(/、、/g, "、");
    const out = box.querySelector("#hypho-text");
    if (out) out.textContent = text;
    const vname = (q("variable").value || "").trim() || "<変数名>";
    const line = INTENT_HYPOTHESIS +
      base + text + '" --specialist ' + (s.target || "default") +
      " --variable " + vname +
      " --source " + q("source").value;
    box.querySelectorAll("button[data-cmd]").forEach(b => { b.dataset.cmd = line; });
  }
  const factEl = q("fact");
  if (factEl) factEl.addEventListener("change", () => {
    const card = facts.find(c => c.id === factEl.value);
    q("fact-text").value = card ? card.phrase : "";
    if (card) {
      q("source").value = card.source || "log";
      if (q("variable") && card.variable_name) q("variable").value = card.variable_name;
    }
    rebuild();
  });
  const causeEl = q("cause");
  if (causeEl) causeEl.addEventListener("change", () => {
    const c = causes[Number(causeEl.value)];
    q("cause-text").value = c ? c.phrase : "";
    if (c) q("source").value = "code";
    rebuild();
  });
  ["metric", "judge", "source"].forEach(name => {
    const el = q(name);
    if (el) el.addEventListener("change", rebuild);
  });
  ["fact-text", "cause-text", "change", "variable", "metric-text", "judge-text"].forEach(name => {
    const el = q(name);
    if (el) el.addEventListener("input", rebuild);
  });
  rebuild();
}

function renderDirections(s) {
  const dir = (s && s.directions) || {};
  const items = dir.items || [];
  if (!items.length) return "";
  let h = "<h2>設計の方向（1変数では表せない材料）</h2>";
  if (dir.note) h += `<p class="meta">${esc(dir.note)}</p>`;
  items.forEach(it => {
    h += '<div class="fact direction">';
    h += '<div class="fact-head">' +
         `<span class="title">${esc(it.title)}</span>` +
         '<span class="badge">方向</span>' +
         '<span class="badge">設計</span></div>';
    if (it.summary) h += `<div class="summary">${esc(it.summary)}</div>`;
    if (it.why && it.why.length) {
      h += '<div class="k">なぜ直接接近が失敗するか（実測）</div><ul class="fact-list">';
      it.why.forEach(x => { h += `<li><span class="text">${esc(x)}</span></li>`; });
      h += "</ul>";
    }
    if (it.steps && it.steps.length) {
      h += '<div class="k">候補の設計（1変数ずつに割ってから着手）</div><ul class="fact-list">';
      it.steps.forEach(x => { h += `<li><span class="text">${esc(x)}</span></li>`; });
      h += "</ul>";
    }
    if (it.metrics) h += `<div class="metric">判定指標: <b>${esc(it.metrics)}</b></div>`;
    if (it.records && it.records.length) {
      h += `<div class="meta">記録: ${it.records.map(esc).join(" / ")}</div>`;
    }
    h += "</div>";
  });
  return h;
}

function renderHypothesis(d) {
  syncHypothesis();
  const s = d.session;
  const sessions = s.sessions || [];
  const cur = sessions.find(x => x.specialist === s.target) || sessions[sessions.length - 1];
  let h = "";
  if (!sessions.length) {
    h += '<div class="empty">セッション記録がありません。' +
         '<code>python analysis/tools/improvement_session.py start --specialist default</code></div>';
  }
  if (cur) {
    h += cards([
      { k: "対象 specialist", v: cur.specialist, cls: cur.specialist === s.submitted ? "" : "warn" },
      { k: "提出用 specialist", v: s.submitted || "—", cls: "ok" },
      { k: "開始", v: (cur.started || "—").replace("T", " ") },
      { k: "仮説", v: (cur.hypotheses || []).length, cls: (cur.hypotheses || []).length ? "ok" : "warn" },
      { k: "前提", v: (cur.assumptions || []).length },
    ]);
    if (cur.specialist !== s.submitted) {
      h += `<p class="meta">対象は <b>${esc(cur.specialist)}</b>（ローカル評価専用）。` +
           `提出するのは <b>${esc(s.submitted)}</b>。${esc(cur.specialist)} を submit しない。</p>`;
    }
  }

  h += "<h2>事実カード（ここから仮説を立てる材料）</h2>";
  const facts = (s.evidence || []).filter(c => c.id !== "paired" && c.kind !== "assumption" && c.kind !== "rule");
  const premises = (s.evidence || []).filter(c => c.kind === "assumption" || c.kind === "rule");
  if (!facts.length) {
    h += '<div class="empty">事実カードを組み立てるデータがありません（ログ・軌跡）。</div>';
  } else {
    h += '<div class="facts">' + renderFactGroups(facts) + "</div>";
  }
  if (premises.length) {
    h += "<h2>前提（参照用・処理済み管理の対象外）</h2>";
    h += '<div class="facts">' + premises.map(c => renderFact(c, "")).join("") + "</div>";
  }

  h += renderDirections(s);

  const ow = s.open_work || {};
  const unv = ow.unverified || [], nxt = ow.next_steps || [];
  if (unv.length || nxt.length) {
    h += "<h2>未着手の宿題</h2>" + '<ul class="fact-list">';
    unv.forEach(x => { h += `<li><span class="title">${esc(x.id)} 未検証</span><span class="text">${esc(x.text)}</span></li>`; });
    nxt.forEach(x => { h += `<li><span class="title">${esc(x.id)}${x.at ? " " + esc(x.at) : ""} 次の一手</span><span class="text">${esc(x.text)}</span></li>`; });
    h += "</ul>";
  }

  h += "<h2>仮説ビルダー（選んで登録）</h2>";
  h += renderHypothesisBuilder(s, d);

  document.getElementById("hyp").innerHTML = h;
  restoreHypothesis();
  bindCopy(document.getElementById("hyp"));
  bindFactToggle(document.getElementById("hyp"));
  bindHypothesisBuilder(document.getElementById("hyp"), s, d);
}

function renderSession(d) {
  const s = d.session;
  const sessions = s.sessions || [];
  const cur = sessions.find(x => x.specialist === s.target) || sessions[sessions.length - 1];
  let h = "";
  if (!sessions.length) {
    h += '<div class="empty">セッション記録がありません。' +
         '<code>python analysis/tools/improvement_session.py start --specialist default</code></div>';
  }
  if (cur) {
    h += cards([
      { k: "対象 specialist", v: cur.specialist, cls: cur.specialist === s.submitted ? "" : "warn" },
      { k: "提出用 specialist", v: s.submitted || "—", cls: "ok" },
      { k: "仮説", v: (cur.hypotheses || []).length, cls: (cur.hypotheses || []).length ? "ok" : "warn" },
      { k: "サイクル", v: (cur.cycles || []).length },
    ]);
  }

  h += "<h2>改善サイクル（現在地）</h2>" + renderSteps(s.steps);

  if (cur) {
    const items = [

      ...(cur.cycles || []).map(x => ["サイクル", JSON.stringify(x)]),
    ];
    h += "<h2>仮説・サイクル・記録</h2>";
    h += items.length
      ? table([{label:"種別",num:false},{label:"内容",num:false}],
          items.map(i => [esc(i[0]), `<code>${esc(i[1])}</code>`]))
      : '<div class="empty">まだ記録がありません。</div>';

  document.getElementById("session").innerHTML = h;
  bindCopy(document.getElementById("session"));

function hypOptionLabel(h) {
  const t = String(h.text || "").replace(/\s+/g, " ").trim();
  const short = t.length > 54 ? t.slice(0, 53) + "…" : t;
  return `${h.id || "?"} — ${short}`;
}

function withHypothesis(cmd, id) {
  if (!cmd || !id) return cmd;
  return `${cmd} --hypothesis ${id}`;
}

function renderVerify(d) {
  const s = d.session || {};
  const hyps = s.hypotheses || [];
  // 未検証かどうかは serve.py の pending（validate/record 紐付けを除外）を唯一の正とする
  const pendIds = new Set(s.pending || []);
  const pend = hyps.filter(h => pendIds.has(h.id));
  if (!hyps.length) {
    document.getElementById("verify").innerHTML =
      '<div class="empty">検証する仮説がありません。<br>' +
      '「改善サイクル」タブで仮説を登録すると、ここに検証コマンドが表示されます。<br>' +
      '<code>python analysis/tools/improvement_session.py hypothesis "..." --specialist ' +
      esc(s.target || "default") + ' --source log</code></div>';
    return;
  }
  if (!pend.length) {
    document.getElementById("verify").innerHTML =
      '<div class="empty">未検証の仮説はありません（' + hyps.length + ' 件すべて検証済み）。</div>';
    return;
  }
  if (!state.verifyHyp || !pend.some(h => h.id === state.verifyHyp)) {
    state.verifyHyp = pend[pend.length - 1].id;
  }
  const sel = state.verifyHyp;
  let h = '<div class="verify-pick"><label for="verify-hyp">検証する仮説</label>' +
          `<select id="verify-hyp">` +
          pend.map(x => `<option value="${attr(x.id)}"${x.id === sel ? " selected" : ""}>` +
                        `${esc(hypOptionLabel(x))}</option>`).join("") +
          `</select></div>`;
  const cur = pend.find(x => x.id === sel);
  if (cur) {
    h += '<div class="verify-block">' +
         `<h3>${esc(cur.id)}<span class="badge">${esc(cur.source || "")}</span></h3>` +
         `<div class="verify-text">${esc(cur.text || "")}</div></div>`;
  }
  h += `<h2>この仮説（${esc(sel)}）の検証コマンド</h2>`;
  h += '<p class="meta">コピーして Terminal で実行（このタブは読み取り専用）。判定は ' +
       '<b>avg_score / avg_our_alive / avg_enemy_alive</b>。実装はこの検証フローの一部。</p>';
  const tgt = s.target || "default";
  const varName = (cur && cur.variable) || "";
  const label = (varName || "hyp").replace(/[^A-Za-z0-9_]/g, "_");
  h += cmdRow(
    `変数 ${varName || "（仮説に未設定）"} を agent/args.json / agent/strategy/specialists/default.py に 1変数だけ実装する（他変数は据置、悪化時に原因を切り分けられるよう同時変更しない）。実装後に②build_submission→③1戦ゲート→④ペア評価→⑤validate へ進む。`,
    "① 実装（1変数）", INTENT_IMPL);
  h += cmdRow("python scripts/build_submission.py --deploy", "② ビルド＆デプロイ");
  h += cmdRow(
    'docker exec atla5-cpu bash -lc "cd /workspace && python validate.py --youth 1 --num-validation 1 --visualize 0"',
    "③ 1戦ゲート（悪化なら即 revert・以降の実行を中止）");
  h += cmdRow(
    `docker exec atla5-cpu bash -lc "cd /workspace && python /repo/local_test/run_eval_paired.py --seeds 1,2,3 --colors both --label ${label} --out /workspace/paired/${label}.json"`,
    `④ seed固定ペア評価（label=${label}）`);
  h += cmdRow(
    `python analysis/tools/improvement_session.py validate --specialist ${tgt} --paired workspace/paired/${label}.json --hypothesis ${sel}`,
    "⑤ 仮説IDと紐付け消化（validate。これで pending から消える）");
  h += cmdRow(
    `python analysis/tools/improvement_session.py record --specialist ${tgt} --kind observation --source log --hypothesis ${sel} --direction "<方向>" --changes "<①で実装した内容>" --verification "<ペア評価の判定>" --next-steps "<次>"`,
    "⑥ record で記録（<> を埋めて実行）。採用なら revert せず、不採用なら ① の変更を revert");
  document.getElementById("verify").innerHTML = h;
  const pick = document.getElementById("verify-hyp");
  if (pick) {
    pick.addEventListener("change", () => { state.verifyHyp = pick.value; renderVerify(d); });
  }
  bindCopy(document.getElementById("verify"));
}

  ["コミット＆プッシュ",
   "変更をコミットしてプッシュして。事前に git status と git diff を確認し、ステージ対象のファイル一覧とコミットメッセージ案を提示して承認を得ること"],

  ["マージ", "PR をマージして"],
];
const GIT_CMD_ROW = '<div class="cmd-row">' +
  '<button class="copy" data-cmd="status">ステータス表示</button>' +
  '<button class="copy" data-cmd="log -1">最近のコミット</button>' +
  '<button class="copy" data-cmd="branch">ブランチ表示</button>' +
  '</div><div class="cmd-row"><span class="row-label">指示</span>' +

    `<button class="copy" data-cmd="${attr(text)}">${esc(label)}</button>`).join("") +

function renderGit(d) {
  const g = d.git;
  const ab = g.ahead_behind;
  const total = g.dirty.modified + g.dirty.untracked + g.dirty.other;
  const parts = [];
  if (g.dirty.modified) parts.push("変更 " + g.dirty.modified);
  if (g.dirty.untracked) parts.push("未追跡 " + g.dirty.untracked);
  if (g.dirty.other) parts.push("その他 " + g.dirty.other);
  const branchV = g.branch + (ab ? `（ahead ${ab.ahead} / behind ${ab.behind}）` : "");
  let h = GIT_CMD_ROW + cards([
    { k: "ブランチ", v: branchV, cls: ab && ab.ahead ? "warn" : "" },
    { k: "未コミット", v: total ? `${total}（${parts.join("・")}）` : "0",
      cls: total ? "warn" : "ok" },
  ]);
  h += "<h2>リモート</h2>";
  h += table([{label:"項目",num:false},{label:"値",num:false}], [
    ["origin", esc(g.remote || "未設定")], ["upstream", esc(g.upstream || "未設定")],
  ]);
  h += "<h2>直近のコミット</h2>";
  h += g.recent.length ? "<pre>" + esc(g.recent.join("\n")) + "</pre>" : '<div class="empty">なし</div>';
  const rcards = (g.review && g.review.cards) || [];
  if (g.review && g.review.error) {
    h += `<p class="meta">文章レビュー取得失敗: ${esc(g.review.error)}</p>`;
  } else {
    h += "<h2>文章レビュー（文字化け・最新性）</h2>";
    if (g.review && g.review.note) h += `<p class="meta">${esc(g.review.note)}</p>`;
    if (rcards.length) h += renderFactGroups(rcards);
  }
  document.getElementById("git").innerHTML = h;
  bindCopy(document.getElementById("git"));
  bindFactToggle(document.getElementById("git"));
}

function renderCmd(d) {
  let h = "";
  d.commands.forEach(group => {
    h += `<h2>${esc(group.group)}</h2>`;
    group.items.forEach(item => {
      h += `<div class="cmd"><span class="title">${esc(item.title)}</span>` +

const TRAJ_SLOT_COLORS = ["#58a6ff", "#3fb950", "#d29922", "#a371f7"];
const TRAJ_RING_COLORS = { radar: "rgba(88,166,255,0.20)", irst: "rgba(163,113,247,0.18)", mws: "rgba(248,81,73,0.35)" };
const TRAJ_SENSOR_COLORS = { radar: "#58a6ff", irst: "#a371f7", rcs: "#ffd33d", far: "#8b949e" };
const TRAJ_EVENT_COLORS = { lost: "#f85149", lose: "#f85149", warning: "#f85149", launch: "#ff7b72",
                            lock: "#58a6ff", detect: "#3fb950", hit: "#3fb950", miss: "#8b949e" };

// キャンバス内の重要イベントの一時表示（発射・命中/空振り・被弾警報・初発見など）。
// 図の中央（自機と敵機の間）を隠さないよう、キャンバス左上の固定バナーに重ねて出す。
// フレーム到達時に pushFrameToasts で追加し、EVENT_TOAST_FRAMES フレーム(1×時)かけてフェードアウトする。
const EVENT_TOAST_FRAMES = 50;
const EVENT_TOAST_TAGS = { launch: "発射", hit: "命中", miss: "空振り", warning: "被弾警報",
                           lost: "撃墜?", lock: "射撃指示", first: "初発見" };

function pushFrameToasts(state, frame) {
  const now = state.t;
  if (state._lastT !== undefined && now < state._lastT) state._toastSeen = new Set();
  state._lastT = now;
  if (!frame) return;
  (frame.events || []).forEach(ev => {
    if (ev.t !== now) return;
    const kind = ev.first === true ? "first" : ev.kind;
    if (!EVENT_TOAST_TAGS[kind]) return;
    const key = now + ":" + kind + ":" + ev.slot;
    if ((state._toastSeen || new Set()).has(key)) return;
    (state._toastSeen = state._toastSeen || new Set()).add(key);
    const toasts = (state.toasts = state.toasts || []);
    while (toasts.length && now - toasts[0].t0 > EVENT_TOAST_FRAMES) toasts.shift();
    toasts.push({ text: ev.text, t0: now, kind, slot: ev.slot });
  });
}

function drawEventToasts(ctx, state) {
  const visible = (state.toasts || []).filter(ev => ev.t0 <= state.t && state.t - ev.t0 <= EVENT_TOAST_FRAMES);
  visible.slice(-4).forEach((ev, i) => {
    const age = state.t - ev.t0;
    const label = (EVENT_TOAST_TAGS[ev.kind] || ev.kind) + " " + ev.text;
    const x = 10, y = 16 * (i + 1);
    ctx.globalAlpha = Math.max(0, 1 - age / EVENT_TOAST_FRAMES);
    ctx.font = "bold 11px Consolas, monospace";
    ctx.lineWidth = 3;
    ctx.strokeStyle = "rgba(11,15,20,0.9)";
    ctx.strokeText(label, x + 1, y);
    ctx.fillStyle = TRAJ_EVENT_COLORS[ev.kind] || "#e6edf3";
    ctx.fillText(label, x, y - 1);
    ctx.globalAlpha = 1;
  });
}

function trajColor(slot) {
  const i = traj.data ? traj.data.slots.indexOf(slot) : -1;
  return TRAJ_SLOT_COLORS[(i < 0 ? 0 : i) % TRAJ_SLOT_COLORS.length];
}

async function loadTrajEntries(force) {
  const box = document.getElementById("traj");
  if (!box) return;
  if (!force && traj.entries.length) return;
  box.innerHTML = '<div class="empty">軌跡データを読み込み中…</div>';
  let payload;
  try {
    const res = await fetch("/api/replays", { cache: "no-store" });
    payload = await res.json();
  } catch (err) {
    box.innerHTML = '<div class="empty">読み込み失敗: ' + esc(err) + '</div>';
    return;
  }
  traj.entries = payload.entries || [];
  if (payload.error) {
    box.innerHTML = '<div class="empty">' + esc(payload.error) + '</div>';
    return;
  }
  if (!traj.entries.length) {
    box.innerHTML = '<div class="empty">再生可能なログがありません。<br>'
      + '軌跡の復元は自作エージェント（EscortHunterAgent）のログのみ対象です。'
      + 'BenchMark 同士のログは observation がスカラー構造で位置情報を持たないため再生できません。</div>';
    return;
  }
  buildTrajShell();
  const keep = traj.entries.some(e => e.log === traj.log);
  const target = keep ? traj.log : traj.entries[0].log;
  document.getElementById("traj-sel").value = target;
  await openTraj(target);
  if (document.getElementById("battle")) {
    buildBattleShell();
    document.getElementById("battle-sel").value = target;
    await openBattle(target);
  }
}

async function openTraj(log) {
  const btn = document.getElementById("traj-play");
  if (btn) { traj.playing = false; clearInterval(traj.timer); traj.timer = null; btn.textContent = "▶ 再生"; }
  const info = document.getElementById("traj-info");
  if (info) info.innerHTML = '<div class="empty">読み込み中…</div>';
  let payload;
  try {
    const res = await fetch("/api/replay?log=" + encodeURIComponent(log), { cache: "no-store" });
    payload = await res.json();
  } catch (err) {
    if (info) info.innerHTML = '<div class="empty">読み込み失敗: ' + esc(err) + '</div>';
    return;
  }
  if (payload.error) {
    if (info) info.innerHTML = '<div class="empty">' + esc(payload.error) + '</div>';
    return;
  }
  traj.data = payload;
  traj.log = log;
  traj.t = 0;
  const mnote = document.getElementById("traj-missile-note");
  if (mnote) {
    const mm = payload.missile_model || {};
    mnote.textContent = `速度 ${mm.speed_kms ?? 1.5} km/s で直線補間、発射から最長 ${mm.max_sec ?? 60} s`;
  }
  const seek = document.getElementById("traj-seek");
  seek.max = Math.max(0, payload.frame_count - 1);
  seek.value = 0;
  renderTrajLegend();
  renderTrajEvents();
  drawTraj();
}

function toggleTraj() {
  const btn = document.getElementById("traj-play");
  traj.playing = !traj.playing;
  btn.textContent = traj.playing ? "❚❚ 一時停止" : "▶ 再生";
  clearInterval(traj.timer);
  traj.timer = null;
  if (!traj.playing) return;
  traj.timer = setInterval(() => {
    if (!traj.data) return;
    const last = traj.data.frame_count - 1;
    if (traj.speed < 1) {
      traj.sub = (traj.sub || 0) + traj.speed;
      if (traj.sub < 1) return;
      traj.sub -= 1;
    }
    const inc = Math.round(traj.speed >= 1 ? traj.speed : 1);
    traj.t = traj.t >= last ? 0 : Math.min(last, traj.t + inc);
    document.getElementById("traj-seek").value = traj.t;
    drawTraj();
  }, 50);
}
